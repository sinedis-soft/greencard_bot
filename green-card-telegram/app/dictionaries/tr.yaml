    SINEDIS kişisel veri işleme politikası

    SINEDIS Sp. z o.o., kişisel verileri AB 2016/679 Tüzüğü (GDPR / RODO) ve Polonya mevzuatına uygun şekilde işlemektedir.

    Veriler aşağıdaki amaçlarla kullanılmaktadır:
    • sigorta tekliflerinin hazırlanması;
    • sigorta sözleşmelerinin düzenlenmesi ve yönetimi;
    • müşteri ile iletişim kurulması;
    • yasal yükümlülüklerin yerine getirilmesi;
    • kullanıcının onayı olması halinde pazarlama iletişimi.

    İşlenebilecek veriler:
    ad-soyad, telefon, e-posta, adres, araç bilgileri, sigorta bilgileri, ödeme ve teknik veriler.

    Veriler, hizmetlerin sağlanabilmesi için sigorta şirketlerine, BT yüklenicilerine ve diğer iş ortaklarına aktarılabilir.

    Kullanıcının hakları:
    • verilere erişim talep etme;
    • verileri düzeltme veya silme;
    • veri işlemesini sınırlandırma;
    • verilen onayı geri çekme;
    • PUODO’ya şikâyette bulunma.

    Veri sorumlusu, poliçeyi düzenleyen sigorta şirketi veya SINEDIS Sp. z o.o. olabilir.

    İletişim:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - veri koruma sorumlusu

    Politikanın tam sürümü:
    https://greencard.agency

    ________________________

