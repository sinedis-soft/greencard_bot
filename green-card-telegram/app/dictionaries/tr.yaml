  ask_consent: |
    SINEDIS kişisel verilerin işlenmesi politikası
    SINEDIS Sp. z o.o., kişisel verileri AB 2016/679 Tüzüğü (GDPR / RODO) ve Polonya mevzuatına uygun olarak işler.
    Veriler şu amaçlarla kullanılır:
    • sigorta tekliflerinin hesaplanması;
    • sigorta sözleşmelerinin düzenlenmesi ve takibi;
    • müşteri ile iletişim;
    • yasal gerekliliklerin yerine getirilmesi;
    • kullanıcının onayı varsa pazarlama iletişimi.
    Aşağıdaki veriler işlenebilir:
    ad, telefon, e-mail, adres, araç bilgileri, sigorta bilgileri, ödeme ve teknik veriler.
    Veriler, hizmetlerin sağlanması için gerekli olan sigorta şirketlerine, IT yüklenicilerine ve diğer ortaklara aktarılabilir.
    Kullanıcının hakları:
    • verilere erişim sağlama;
    • verileri düzeltme veya silme;
    • işlemeyi kısıtlama;
    • onayı geri çekme;
    • PUODO'ya şikâyette bulunma.
    Veri yöneticisi, poliçeyi düzenleyen sigorta şirketi veya SINEDIS Sp. z o.o. olabilir.
    İletişim:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - veri koruma görevlisi
    Politikanın tam sürümü:
    https://greencard.agency
    ________________________
    Kişisel verilerin işlenmesini ve aktarılmasını kabul ediyor musunuz?
