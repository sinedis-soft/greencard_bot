faq:
  title: "SSS kategorisini seçin"

  categories:
    documents: "📄 Belgeler"
    payment: "💳 Ödeme"
    coverage: "🌍 Geçerlilik bölgesi"
    validity: "📅 Geçerlilik süresi"
    delivery: "📧 Poliçenin teslimi"
    border: "🛂 Sınır geçişi"
    accident: "🚗 Kaza ve sigorta olayı"
    mistakes: "⚠️ Önemli bilgiler"
    refund: "↩️ İade"
    whatis: "ℹ️ Europolis nedir?"
    nogreencard: "🟢 Green Card’dan farkı"
    vehicles: "🚘 Araç türleri"
    extension: "🔄 Poliçe uzatma"
    legalentity: "🏢 Tüzel kişiler"
    online: "📱 Online düzenleme"
    database: "🔍 Poliçe kontrolü"
    restrictions: "⛔ Kısıtlamalar"
    support: "👨‍💼 Operatör ile iletişim"

  answers:

    documents: |
      Poliçe düzenlenmesi için aşağıdaki belgeler gereklidir:

      • Araç sahibinin pasaportu veya kimlik belgesi;
      • Araç ruhsatı;
      • Araç plaka numarası;
      • VIN numarası;
      • İletişim telefonu;
      • Poliçenin gönderileceği e-posta adresi;
      • Sigorta başlangıç tarihi ve süresi.

      Belgeler alındıktan sonra operatör bilgileri kontrol eder ve poliçeyi hazırlar.

    payment: |
      Aşağıdaki ödeme yöntemleri kullanılabilir:

      • Polonya banka hesabına havale;
      • Polonya banka kartına transfer;
      • Polonya telefon numarasına BLIK ödemesi.

      Poliçe, ödemenin ulaştığı onaylandıktan sonra düzenlenir.

    coverage: |
      Poliçe, Avrupa Birliği ve Avrupa Ekonomik Alanı ülkelerinde geçerlidir.

      Seyahatten önce sigorta sertifikanızda belirtilen ülke listesini mutlaka kontrol edin.

    validity: |
      Sigorta teminatı, poliçede belirtilen tarih ve saatten itibaren geçerli olur.

      Sigorta gelecekteki bir tarih için önceden düzenlenebilir, ancak teminat başlangıcından en erken 7 gün önce yapılabilir.

      Araç bilgileri sigorta şirketinden UFG sistemine birkaç saat ile bir gün arasında aktarıldığı için, poliçeyi sınır geçişinden en az birkaç saat önce düzenlemenizi tavsiye ederiz.

      ☝️Lütfen dikkat edin! Tüm araç marka ve modelleri sigorta şirketinin veri tabanında bulunmamaktadır. Bazı araçlar BDT ülkeleri veya ABD pazarı için üretilmiştir ve AB’de yaygın değildir. Bu tür araçlar yalnızca hafta içi Varşova saatiyle 09:00–21:00 arasında ve cumartesi günleri 09:00–15:00 saatleri arasında sigortalanabilir.

    delivery: |
      Poliçe düzenlenip ödeme onaylandıktan sonra PDF formatında belirtilen e-posta adresine gönderilir.

      Sertifikanın siyah-beyaz çıktı olarak yazdırılması tavsiye edilir.

      E-posta ulaşmadıysa “Spam” klasörünü kontrol edin veya operatör ile iletişime geçin.

    border: |
      Sınır geçişi sırasında aşağıdakilerin yanınızda bulunması tavsiye edilir:

      • Yazdırılmış poliçe;
      • Araç belgeleri;
      • Pasaport veya kimlik.

      Geçişe izin verilmesi konusundaki nihai karar sınır görevlilerine aittir.

    accident: |
      Trafik kazası durumunda:

      • Güvenliği sağlayın;
      • Gerekirse polisi çağırın;
      • Olayın koşullarını belgeleyin;
      • Sigorta şirketine bildirim yapın
      (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      Resmî işlem yapılmadan kaza yerini terk etmeyin.

    mistakes: |
      Başvuruyu onaylamadan önce aşağıdakileri dikkatlice kontrol edin:

      • VIN numarası;
      • Plaka numarası;
      • Araç türü;
      • Sigorta tarihleri.

      Hatalar, sınır geçişinin reddedilmesine veya hasar dosyasında sorun yaşanmasına neden olabilir.

    refund: |
      Sigorta poliçesi düzenlendikten sonra sigorta priminin iadesi genellikle mümkün değildir.

      Bazı durumlarda iptal veya iade talepleri sigorta şirketi tarafından bireysel olarak değerlendirilir.

    whatis: |
      OC Graniczne, AB dışında kayıtlı araçlar için zorunlu mali sorumluluk sigortasıdır.

      Poliçe, sertifikada belirtilen ülkelerde yasal olarak araç kullanmanıza olanak sağlar.

        nogreencard: |
      Green Card ve OC Graniczne farklı sigorta ürünleridir.

      Green Card, aracın kayıtlı olduğu ülkede düzenlenir.

      OC Graniczne ise geçerli bir Green Card bulunmadığında AB’ye giriş için kullanılır.

    vehicles: |
      Aşağıdaki araçlar için düzenleme mümkündür:

      • Binek araçlar;
      • Kamyonlar;
      • Otobüsler;
      • Römorklar;
      • Motosikletler;
      • Özel amaçlı araçlar.

      Poliçe düzenlenebilmesi, aracın kayıtlı olduğu ülkeye ve sigorta şirketinin şartlarına bağlıdır.

    extension: |
      Teknik olarak poliçe uzatma işlemi yoktur.

      Sadece yeni bir poliçe düzenlenebilir.

    legalentity: |
      Poliçe yalnızca gerçek kişi adına düzenlenebilir.

      Kurumsal müşteriler için poliçe sürücü adına düzenlenmelidir.

    online: |
      Tüm işlem tamamen uzaktan gerçekleştirilir.

      Belgeler online olarak kabul edilir ve hazır poliçe e-posta ile gönderilir.

    database: |
      Poliçe düzenlendikten sonra bilgiler sigorta veri tabanlarında hemen görünmeyebilir.

      Bilgilerin güncellenmesi bazen 24 saate kadar sürebilir.

      Poliçeyi şu siteden kontrol edebilirsiniz:
      https://www.ufg.pl/

    restrictions: |
      Sınır sigortası yalnızca üçüncü şahıslara karşı mali sorumluluğu kapsar.

      Kendi aracınızda oluşan hasarlar teminat kapsamında değildir.

    support: |
      Poliçenin düzenlenmesi, ödemesi veya geçerliliği ile ilgili sorularınız varsa Telegram veya WhatsApp üzerinden operatör ile iletişime geçin.

coverage:
  text: |
    OC graniczne (sınır sigortası) geçerlilik haritası.

    Seyahatten önce poliçenizde belirtilen ülke kodlarını mutlaka kontrol edin.

    A - Avusturya, B - Belçika, BG - Bulgaristan, CY - Kıbrıs, CZ - Çekya, D - Almanya, DK - Danimarka, E - İspanya, EST - Estonya, F - Fransa, FIN - Finlandiya, GR - Yunanistan, H - Macaristan, HR - Hırvatistan, I - İtalya, IRL - İrlanda, IS - İzlanda, L - Lüksemburg, LT - Litvanya, LV - Letonya, M - Malta, N - Norveç, NL - Hollanda, P - Portekiz, PL - Polonya, RO - Romanya, S - İsveç, SK - Slovakya, SLO - Slovenya, CH - İsviçre.

