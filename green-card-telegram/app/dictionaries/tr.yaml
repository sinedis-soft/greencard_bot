  ask_consent: |
    SINEDIS Kişisel Verilerin İşlenmesi Politikası
    SINEDIS Sp. z o.o. kişisel verileri AB 2016/679 Yönetmeliği (GDPR / RODO) ve Polonya mevzuatına uygun olarak işler.
    Veriler şu amaçlarla kullanılır:
    • sigorta tekliflerinin hesaplanması;
    • sigorta sözleşmelerinin düzenlenmesi ve hizmetinin sağlanması;
    • müşteri ile iletişim kurulması;
    • yasal gerekliliklerin yerine getirilmesi;
    • kullanıcının onayı olması halinde pazarlama iletişimi.
    İşlenebilecek veriler:
    ad, telefon, e-mail, adres, araç bilgileri, sigorta bilgileri, ödeme ve teknik veriler.
    Veriler, hizmetlerin sağlanması için gerekli olan sigorta şirketlerine, IT yüklenicilerine ve diğer iş ortaklarına aktarılabilir.
    Kullanıcının hakları:
    • verilere erişim sağlama;
    • verileri düzeltme veya silme;
    • işlemeyi sınırlandırma;
    • onayı geri çekme;
    • PUODO’ya şikâyette bulunma.
    Veri sorumlusu, poliçeyi düzenleyen sigorta şirketi veya SINEDIS Sp. z o.o. olabilir.
    İletişim:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - veri koruma görevlisi
    Politikanın tam sürümü:
    https://greencard.agency
    ________________________
    Kişisel verilerin işlenmesine ve aktarılmasına onay veriyor musunuz?"
