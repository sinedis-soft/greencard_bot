faq:
  title: "SSS kategorisini seçin"
  categories:
    documents: "Düzenleme için belgeler"
    payment: "Ödeme"
    coverage: "Kapsam"
    mistakes: "Dikkat edilecekler"
    refund: "İade"
  answers:
    documents: |
      Poliçenin düzenlenmesi için şu bilgiler gereklidir: pasaport bilgileri, araç bilgileri ve sigorta geçerlilik tarihleri.
      Bu nedenle şunları hazırlamanız gerekir:
      - pasaport
      - araç tescil belgesi
      - aracın teknik bilgileri
      - telefon numarası
      - e-mail
    payment: |
      Mevcut ödeme yöntemleri:
      - Polonya kartına havale,
      - telefon numarasına BLIK ödemesi,
      - Polonya banka hesabına havale
    coverage: "Kapsam bölgesi: A - Avusturya, B - Belçika, BG - Bulgaristan, CY - Kıbrıs, CZ - Çekya, D - Almanya, DK - Danimarka, E - İspanya, EST - Estonya, F - Fransa, FIN - Finlandiya, GR - Yunanistan, H - Macaristan, HR - Hırvatistan, I - İtalya, IRL - İrlanda, IS - İzlanda, L - Lüksemburg, LT - Litvanya, LV - Letonya, M - Malta, N - Norveç, NL - Hollanda, P - Portekiz, PL - Polonya, RO - Romanya, S - İsveç, SK - Slovakya, SLO - Slovenya, CH - İsviçre."
    mistakes: "Göndermeden önce lütfen VIN, plaka ve sigorta süresini iki kez kontrol edin. Daha sonra düzeltme yapılamaz!"
    refund: "Para iadesi yapılmaz."

