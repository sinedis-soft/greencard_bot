faq:
  title: "FAQ kategorisini seçin"
  categories:
    documents: "Düzenleme için belgeler"
    payment: "Ödeme"
    coverage: "Kapsam"
    mistakes: "Dikkat edilmesi gerekenler"
    refund: "İade"
  answers:
    documents: |
      Poliçenin düzenlenmesi için şu bilgiler gereklidir: pasaport bilgileri, araç bilgileri ve sigortanın geçerlilik tarihleri
      Bu nedenle şunları hazırlamanız gerekir:
      - pasaport
      - araç tescil belgesi
      - aracın teknik bilgileri
      - telefon numarası
      - e-Mail
    payment: |
      Mevcut ödeme seçenekleri:
      - Polonya kartına havale ile ödeme, 
      - telefon numarasına BLIK ile ödeme, 
      - Polonya banka hesabına havale ile ödeme"
    coverage: "Kapsam bölgesi: A - Avusturya, B - Belçika, BG - Bulgaristan, CY - Kıbrıs, CZ - Çekya, D - Almanya, DK - Danimarka, E - İspanya, EST - Estonya, F - Fransa, FIN - Finlandiya, GR - Yunanistan, H - Macaristan, HR - Hırvatistan, I - İtalya, IRL - İrlanda, IS - İzlanda, L - Lüksemburg, LT - Litvanya, LV - Letonya, M - Malta, N - Norveç, NL - Hollanda, P - Portekiz, PL - Polonya, RO - Romanya, S - İsveç, SK - Slovakya, SLO - Slovenya, CH - İsviçre."
    mistakes: "Göndermeden önce VIN, plaka numarası ve sigorta süresini lütfen iki kez kontrol edin. Daha sonra düzeltme yapmak mümkün olmayacaktır!"
    refund: "Ücret iadesi yapılmaz."

