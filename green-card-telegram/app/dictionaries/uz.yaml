  answers:

    documents: |
      Polisni rasmiylashtirish uchun quyidagilar talab qilinadi:

      • Egasining pasporti yoki ID kartasi;
      • Transport vositasini ro‘yxatdan o‘tkazish guvohnomasi;
      • Avtomobil davlat raqami;
      • VIN raqami;
      • Aloqa uchun telefon raqami;
      • Polisni olish uchun e-mail;
      • Sug‘urta boshlanish sanasi va muddati.

      Hujjatlar olingandan so‘ng operator ma’lumotlarni tekshiradi va polisni tayyorlaydi.

    payment: |
      Quyidagi to‘lov usullari mavjud:

      • Polsha bank hisobiga o‘tkazma;
      • Polsha bank kartasiga o‘tkazma;
      • Polsha telefon raqamiga BLIK to‘lovi.

      Polis to‘lov tushgani tasdiqlangandan keyin rasmiylashtiriladi.

    coverage: |
      Polis Yevropa Ittifoqi va Yevropa iqtisodiy hududi davlatlarida amal qiladi.

      Safardan oldin sug‘urta sertifikatida ko‘rsatilgan davlatlar ro‘yxatini albatta tekshiring.

    validity: |
      Sug‘urta himoyasi polisda ko‘rsatilgan sana va vaqtdan boshlab amal qiladi.

      Sug‘urtani kelajakdagi sana uchun oldindan rasmiylashtirish mumkin, ammo qoplama boshlanishidan 7 kundan oldin emas.

      Polisni chegaradan o‘tishdan kamida bir necha soat oldin rasmiylashtirishni tavsiya qilamiz. Chunki avtomobil ma’lumotlari sug‘urta kompaniyasidan UFG bazasiga bir necha soatdan bir sutkagacha muddatda uzatiladi.

      ☝️E’tibor bering! Barcha avtomobil markalari va modellari sug‘urta kompaniyasi bazasida mavjud emas. Ayrim avtomobillar MDH davlatlari yoki AQSh bozori uchun ishlab chiqarilgan bo‘lib, Yevropa Ittifoqida kam uchraydi. Bunday avtomobillarni faqat ish kunlari Varshava vaqti bilan 9:00 dan 21:00 gacha va shanba kuni 09:00 dan 15:00 gacha sug‘urtalash mumkin.

    delivery: |
      Polis rasmiylashtirilib, to‘lov tasdiqlangandan so‘ng PDF formatida ko‘rsatilgan e-mail manziliga yuboriladi.

      Sertifikatni oq-qora shaklda chop etish tavsiya etiladi.

      Agar xat kelmagan bo‘lsa, “Spam” papkasini tekshiring yoki operator bilan bog‘laning.

    border: |
      Chegaradan o‘tishda quyidagilarni yoningizda olib yurish tavsiya etiladi:

      • Chop etilgan polis;
      • Avtomobil hujjatlari;
      • Pasport yoki ID karta.

      O‘tkazish bo‘yicha yakuniy qarorni chegara xizmati qabul qiladi.

    accident: |
      YTH sodir bo‘lganda quyidagilarni bajarish kerak:

      • Xavfsizlikni ta’minlash;
      • Zarurat bo‘lsa, politsiyani chaqirish;
      • Hodisa holatlarini qayd etish;
      • Sug‘urtalovchiga xabar berish (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      Hodisa rasmiylashtirilmasdan voqea joyini tark etmang.

    mistakes: |
      Arizani tasdiqlashdan oldin quyidagilarni diqqat bilan tekshiring:

      • VIN raqami;
      • Davlat raqami;
      • Transport vositasi turi;
      • Sug‘urta sanalari.

      Xatolar chegaradan o‘tishni rad etilishiga yoki zararlarni qoplashda muammolarga olib kelishi mumkin.

    refund: |
      Sug‘urta polisi chiqarilgandan keyin sug‘urta mukofotini qaytarish odatda mumkin emas.

      Ayrim hollarda qaytarish yoki polisni bekor qilish masalasi sug‘urtalovchi tomonidan individual tarzda ko‘rib chiqiladi.

    whatis: |
      OC Graniczne — Yevropa Ittifoqidan tashqarida ro‘yxatdan o‘tgan transport vositalari uchun majburiy fuqarolik javobgarligi sug‘urtasi.

      Polis sertifikatda ko‘rsatilgan davlatlar hududida qonuniy harakatlanish imkonini beradi.

        nogreencard: |
      Green Card va OC Graniczne — turli sug‘urta mahsulotlari.

      Green Card avtomobil ro‘yxatdan o‘tgan davlatda rasmiylashtiriladi.

      OC Graniczne esa amaldagi Green Card mavjud bo‘lmaganda Yevropa Ittifoqiga kirish uchun qo‘llaniladi.

    vehicles: |
      Quyidagi transport vositalari uchun rasmiylashtirish mumkin:

      • Yengil avtomobillar;
      • Yuk avtomobillari;
      • Avtobuslar;
      • Tirkamalar;
      • Mototsikllar;
      • Maxsus texnikalar.

      Rasmiylashtirish imkoniyati transport vositasi ro‘yxatdan o‘tgan davlat va sug‘urtalovchi shartlariga bog‘liq.

    extension: |
      Polisni uzaytirish imkoniyati mavjud emas.

      Faqat yangi polis rasmiylashtiriladi.

    legalentity: |
      Polis faqat jismoniy shaxs nomiga rasmiylashtirilishi mumkin.

      Korporativ mijozlar uchun polis haydovchi nomiga rasmiylashtiriladi.

    online: |
      Rasmiylashtirish to‘liq masofadan turib amalga oshiriladi.

      Hujjatlar onlayn qabul qilinadi, tayyor polis esa elektron pochta orqali yuboriladi.

    database: |
      Polis rasmiylashtirilgandan keyin ma’lumotlar sug‘urta bazalarida darhol ko‘rinmasligi mumkin.

      Ma’lumotlar yangilanishi ba’zan 24 soatgacha davom etadi.

      Polisni quyidagi sayt orqali tekshirish mumkin:
      https://www.ufg.pl/

    restrictions: |
      Chegara sug‘urtasi faqat uchinchi shaxslar oldidagi fuqarolik javobgarligini qoplaydi.

      O‘zingizning avtomobilingizga yetgan zarar qoplanmaydi.

    support: |
      Agar rasmiylashtirish, to‘lov yoki polis amal qilishi bo‘yicha savollaringiz bo‘lsa, Telegram yoki WhatsApp orqali operator bilan bog‘laning.

