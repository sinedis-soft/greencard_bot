  ask_consent: |
    SINEDIS kompaniyasining shaxsiy ma’lumotlarni qayta ishlash siyosati

    SINEDIS Sp. z o.o. shaxsiy ma’lumotlarni Yevropa Ittifoqining 2016/679-sonli Reglamenti (GDPR / RODO) hamda Polsha qonunchiligiga muvofiq qayta ishlaydi.

    Ma’lumotlar quyidagi maqsadlarda foydalaniladi:
    • sug‘urta takliflarini hisoblash;
    • sug‘urta shartnomalarini rasmiylashtirish va yuritish;
    • mijoz bilan aloqa qilish;
    • qonunchilik talablarini bajarish;
    • foydalanuvchi roziligi mavjud bo‘lsa, marketing kommunikatsiyasi uchun.

    Quyidagi ma’lumotlar qayta ishlanishi mumkin:
    ism, telefon raqami, e-mail, manzil, transport vositasi ma’lumotlari, sug‘urta ma’lumotlari, to‘lov va texnik ma’lumotlar.

    Ma’lumotlar sug‘urta kompaniyalari, IT-pudratchilar va xizmat ko‘rsatish uchun zarur bo‘lgan boshqa hamkorларга uzatilishi mumkin.

    Foydalanuvchi quyidagi ҳуқуқларга ega:
    • ma’lumotlarga kirish ҳуқуқi;
    • ma’lumotlarni tuzatish yoki o‘chirish ҳуқуқи;
    • qayta ishlashni cheklash ҳуқуқи;
    • rozilikni bekor qilish ҳуқуқи;
    • PUODO organiga shikoyat yuborish ҳуқуқи.

    Ma’lumotlar administratori polisni rasmiylashtirgan sug‘urta kompaniyasi yoki SINEDIS Sp. z o.o. bo‘lishi mumkin.

    Kontaktlar:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - ma’lumotlarni himoya qilish inspektori

    Siyosatning to‘liq versiyasi:
    https://greencard.agency

    ________________________

    Shaxsiy ma’lumotlarni qayta ishlash va uzatishga rozimisiz?"

