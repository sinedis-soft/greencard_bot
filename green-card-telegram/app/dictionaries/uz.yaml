  title: "FAQ kategoriyasini tanlang"
  categories:
    documents: "Rasmiylashtirish uchun hujjatlar"
    payment: "To‘lov"
    coverage: "Qamrov"
    mistakes: "E’tibor berish kerak"
    refund: "Qaytarish"
  answers:
    documents: |
      Polisni rasmiylashtirish uchun quyidagi ma’lumotlar kerak bo‘ladi: pasport ma’lumotlari, transport vositasi ma’lumotlari va sug‘urta amal qilish sanalari.
      Shuning uchun quyidagilarni tayyorlashingiz kerak:
      - pasport
      - transport vositasining ro‘yxatdan o‘tganlik guvohnomasi
      - avtomobilning texnik ma’lumotlari
      - telefon raqami
      - e-mail
    payment: |
      Mavjud to‘lov usullari:
      - Polsha kartasiga o‘tkazma orqali to‘lov,
      - telefon raqamiga BLIK orqali to‘lov,
      - Polsha hisob raqamiga bank o‘tkazmasi orqali to‘lov
    coverage: "Qamrov hududi: A - Avstriya, B - Belgiya, BG - Bolgariya, CY - Kipr, CZ - Chexiya, D - Germaniya, DK - Daniya, E - Ispaniya, EST - Estoniya, F - Fransiya, FIN - Finlyandiya, GR - Gretsiya, H - Vengriya, HR - Xorvatiya, I - Italiya, IRL - Irlandiya, IS - Islandiya, L - Lyuksemburg, LT - Litva, LV - Latviya, M - Malta, N - Norvegiya, NL - Niderlandiya, P - Portugaliya, PL - Polsha, RO - Ruminiya, S - Shvetsiya, SK - Slovakiya, SLO - Sloveniya, CH - Shveytsariya."
    mistakes: "Iltimos, yuborishdan oldin VIN, davlat raqami va sug‘urta muddatini ikki marta tekshiring. Keyinchalik tuzatish kiritib bo‘lmaydi!"
    refund: "Mablag‘ qaytarilishi rasmiylashtirilmaydi."

