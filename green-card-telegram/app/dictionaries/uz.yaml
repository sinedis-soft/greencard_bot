  ask_consent: |
    SINEDIS shaxsiy ma’lumotlarni qayta ishlash siyosati
    SINEDIS Sp. z o.o. shaxsiy ma’lumotlarni YI 2016/679 reglamenti (GDPR / RODO) va Polsha qonunchiligiga muvofiq qayta ishlaydi.
    Ma’lumotlar quyidagi maqsadlarda ishlatiladi:
    • sug‘urta takliflarini hisoblash;
    • sug‘urta shartnomalarini rasmiylashtirish va kuzatib borish;
    • mijoz bilan aloqa qilish;
    • qonunchilik talablarini bajarish;
    • foydalanuvchi roziligi mavjud bo‘lsa, marketing kommunikatsiyasi.
    Quyidagi ma’lumotlar qayta ishlanishi mumkin:
    ism, telefon, e-mail, manzil, transport vositasi ma’lumotlari, sug‘urta ma’lumotlari, to‘lov va texnik ma’lumotlar.
    Ma’lumotlar sug‘urta kompaniyalariga, IT pudratchilarga va xizmat ko‘rsatish uchun zarur bo‘lgan boshqa hamkorlarga uzatilishi mumkin.
    Foydalanuvchi quyidagi huquqlarga ega:
    • ma’lumotlarga kirish;
    • ma’lumotlarni tuzatish yoki o‘chirish;
    • qayta ishlashni cheklash;
    • rozilikni qaytarib olish;
    • PUODOga shikoyat berish.
    Ma’lumotlar administratori polisni rasmiylashtirgan sug‘urta kompaniyasi yoki SINEDIS Sp. z o.o. bo‘lishi mumkin.
    Kontaktlar:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - ma’lumotlarni himoya qilish inspektori
    Siyosatning to‘liq versiyasi:
    https://greencard.agency
    ________________________
    Shaxsiy ma’lumotlarni qayta ishlash va uzatishga rozimisiz?
  consent_agree: "✅ Rozilik berish va yuborish"
