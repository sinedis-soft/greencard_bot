faq:
  title: "FAQ санатын таңдаңыз"
  categories:
    documents: "Рәсімдеуге қажетті құжаттар"
    payment: "Төлем"
    coverage: "Қамту аумағы"
    mistakes: "Назар аудару қажет"
    refund: "Қайтару"
  answers:
    documents: |
      Полисті рәсімдеу үшін келесі деректер қажет: паспорт деректері, көлік құралының деректері және сақтандырудың әрекет ету мерзімдері бойынша деректер.
      Сондықтан сізге мыналарды дайындау қажет:
      - паспорт
      - көлік құралын тіркеу куәлігі
      - автокөліктің техникалық деректері
      - телефон нөмірі
      - e-Mail
    payment: |
      Қолжетімді төлем тәсілдері:
      - поляк картасына аударым арқылы төлеу,
      - телефон нөміріне BLIK арқылы төлеу,
      - поляк есеп айырысу шотына аударым арқылы төлеу
    coverage: "Қамту аумағы: A - Австрия, B - Бельгия, BG - Болгария, CY - Кипр, CZ - Чехия, D - Германия, DK - Дания, E - Испания, EST - Эстония, F - Франция, FIN - Финляндия, GR - Греция, H - Венгрия, HR - Хорватия, I - Италия, IRL - Ирландия, IS - Исландия, L - Люксембург, LT - Литва, LV - Латвия, M - Мальта, N - Норвегия, NL - Нидерланды, P - Португалия, PL - Польша, RO - Румыния, S - Швеция, SK - Словакия, SLO - Словения, CH - Швейцария."
    mistakes: "Жібермес бұрын VIN, мемлекеттік нөмір және сақтандыру мерзімін екі рет тексеріңіз. Кейін түзету енгізу мүмкін болмайды!"
    refund: "Қаражатты қайтару рәсімделмейді."

