  ask_consent: |
    SINEDIS компаниясының дербес деректерді өңдеу саясаты

    SINEDIS Sp. z o.o. дербес деректерді ЕО-ның 2016/679 Регламентіне (GDPR / RODO) және Польша заңнамасына сәйкес өңдейді.

    Деректер келесі мақсаттарда пайдаланылады:
    • сақтандыру ұсыныстарын есептеу;
    • сақтандыру шарттарын рәсімдеу және сүйемелдеу;
    • клиентпен байланыс;
    • заң талаптарын орындау;
    • пайдаланушының келісімі болған жағдайда маркетингтік коммуникация.

    Келесі деректер өңделуі мүмкін:
    аты-жөні, телефон нөмірі, e-mail, мекенжайы, көлік құралы туралы деректер, сақтандыру ақпараты, төлем және техникалық деректер.

    Деректер сақтандыру компанияларына, IT-мердігерлерге және қызмет көрсету үшін қажетті басқа серіктестерге берілуі мүмкін.

    Пайдаланушының құқықтары:
    • деректерге қол жеткізу;
    • деректерді түзету немесе жою;
    • өңдеуді шектеу;
    • келісімді қайтарып алу;
    • PUODO ұйымына шағым беру.

    Деректер әкімшісі ретінде полисті рәсімдеген сақтандыру компаниясы немесе SINEDIS Sp. z o.o. әрекет ете алады.

    Байланыс:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - деректерді қорғау инспекторы

    Саясаттың толық нұсқасы:
    https://greencard.agency

    ________________________

    Дербес деректерді өңдеуге және беруге келісесіз бе?"

