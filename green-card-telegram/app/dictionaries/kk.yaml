    extension: "🔄 Полисті ұзарту"
    legalentity: "🏢 Заңды тұлғалар"
    online: "📱 Онлайн рәсімдеу"
    database: "🔍 Полисті тексеру"
    restrictions: "⛔ Шектеулер"
    support: "👨‍💼 Оператормен байланыс"

  answers:

    documents: |
      Полисті рәсімдеу үшін келесі құжаттар қажет:

      • Иесінің төлқұжаты немесе жеке куәлігі;
      • Көлік құралының тіркеу куәлігі;
      • Көліктің мемлекеттік нөмірі;
      • VIN нөмірі;
      • Байланыс телефоны;
      • Полисті алу үшін e-mail;
      • Сақтандырудың басталу күні мен мерзімі.

      Құжаттар алынғаннан кейін оператор деректерді тексеріп, полисті дайындайды.

    payment: |
      Келесі төлем тәсілдері қолжетімді:

      • Польша банктік шотына аударым;
      • Польша банктік картасына аударым;
      • Польша телефон нөміріне BLIK төлемі.

      Полис төлемнің түскені расталғаннан кейін рәсімделеді.

    coverage: |
      Полис Еуропалық Одақ және Еуропалық экономикалық аймақ елдерінің аумағында жарамды.

      Сапар алдында сақтандыру сертификатында көрсетілген елдер тізімін міндетті түрде тексеріңіз.

    validity: |
      Сақтандыру қорғанысы полисте көрсетілген күн мен уақыттан бастап күшіне енеді.

      Сақтандыруды болашақ күнге алдын ала рәсімдеуге болады, бірақ сақтандыру күшіне енуіне 7 күннен ерте емес.

      Полисті шекарадан өтуден кемінде бірнеше сағат бұрын рәсімдеуді ұсынамыз. Себебі көлік туралы деректер сақтандыру компаниясынан UFG жүйесіне бірнеше сағаттан бір тәулікке дейін жіберілуі мүмкін.

      ☝️Назар аударыңыз! Кейбір көлік маркалары мен модельдері сақтандыру компаниясының базасында болмауы мүмкін. Кейбір көліктер ТМД елдері немесе АҚШ нарығына арналған және ЕО-да кең таралмаған. Мұндай көліктерді тек жұмыс күндері Варшава уақыты бойынша 9:00–21:00 аралығында және сенбі күні 09:00–15:00 аралығында сақтандыруға болады.

    delivery: |
      Рәсімдеу және төлем расталғаннан кейін полис PDF форматында көрсетілген e-mail мекенжайына жіберіледі.

      Сертификатты ақ-қара форматта басып шығару ұсынылады.

      Егер хат келмесе, «Спам» бумасын тексеріңіз немесе оператормен байланысыңыз.

    border: |
      Шекарадан өткен кезде өзіңізбен бірге мыналар болғаны жөн:

      • Басып шығарылған полис;
      • Көлік құжаттары;
      • Төлқұжат немесе ID.

      Өткізу туралы соңғы шешімді шекара қызметі қабылдайды.

    accident: |
      ЖКО болған жағдайда:

      • Қауіпсіздікті қамтамасыз етіңіз;
      • Қажет болса полиция шақырыңыз;
      • Оқиғаның мән-жайын тіркеңіз;
      • Сақтандырушыға хабарлаңыз (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      Оқиғаны рәсімдемей ЖКО орнын тастап кетпеңіз.

    mistakes: |
      Өтінімді растаудан бұрын мұқият тексеріңіз:

      • VIN нөмірін;
      • Мемлекеттік нөмірді;
      • Көлік түрін;
      • Сақтандыру күндерін.

      Қателер шекарадан өтуден бас тартуға немесе шығындарды реттеу кезінде қиындықтарға әкелуі мүмкін.

    refund: |
      Сақтандыру полисі шығарылғаннан кейін сақтандыру сыйлықақысын қайтару әдетте мүмкін емес.

      Кейбір жағдайларда қайтару немесе күшін жою мәселесі сақтандырушы тарапынан жеке қарастырылады.

    whatis: |
      OC Graniczne — ЕО аумағынан тыс тіркелген көлік құралдарына арналған міндетті азаматтық-құқықтық жауапкершілікті сақтандыру.

      Полис сертификатта көрсетілген елдердің аумағында заңды түрде жүруге мүмкіндік береді.

        nogreencard: |
      Green Card пен OC Graniczne — әртүрлі сақтандыру өнімдері.

      Green Card көлік тіркелген елде рәсімделеді.

      OC Graniczne жарамды Green Card болмаған жағдайда ЕО-ға кіру үшін пайдаланылады.

    vehicles: |
      Келесі көлік түрлерін рәсімдеуге болады:

      • Жеңіл автомобильдер;
      • Жүк автомобильдері;
      • Автобустар;
      • Тіркемелер;
      • Мотоциклдер;
      • Арнайы техника.

      Рәсімдеу мүмкіндігі көліктің тіркелген еліне және сақтандырушы шарттарына байланысты.

    extension: |
      Полисті тікелей ұзарту қарастырылмаған.

      Тек жаңа полисті рәсімдеу мүмкін.

    legalentity: |
      Полис тек жеке тұлғаға рәсімделуі мүмкін.

      Корпоративтік клиенттер үшін полис жүргізушінің атына рәсімделуі тиіс.

    online: |
      Рәсімдеу толықтай қашықтан жүргізіледі.

      Құжаттар онлайн қабылданады, ал дайын полис электрондық пошта арқылы жіберіледі.

    database: |
      Полис рәсімделгеннен кейін деректер сақтандыру базаларында бірден көрінбеуі мүмкін.

      Ақпараттың жаңартылуы кейде 24 сағатқа дейін созылады.

      Полисті келесі сайтта тексеруге болады:
      https://www.ufg.pl/

    restrictions: |
      Шекаралық сақтандыру тек үшінші тұлғалар алдындағы азаматтық жауапкершілікті жабады.

      Сіздің жеке көлігіңізге келтірілген залал өтелмейді.

    support: |
      Егер рәсімдеу, төлем немесе полистің әрекет етуі бойынша сұрақтар туындаса, Telegram немесе WhatsApp арқылы оператормен байланысыңыз.

coverage:
  text: |
    OC graniczne (border insurance) қамту картасы.

    Сапар алдында полистегі ел кодын міндетті түрде тексеріңіз.

