  ask_consent: |
    SINEDIS жеке деректерді өңдеу саясаты
    SINEDIS Sp. z o.o. жеке деректерді ЕО 2016/679 регламентіне (GDPR / RODO) және Польша заңнамасына сәйкес өңдейді.
    Деректер келесі мақсаттарда пайдаланылады:
    • сақтандыру ұсыныстарын есептеу;
    • сақтандыру шарттарын рәсімдеу және сүйемелдеу;
    • клиентпен байланысу;
    • заңнама талаптарын орындау;
    • пайдаланушы келісімі болған жағдайда маркетингтік коммуникация.
    Келесі деректер өңделуі мүмкін:
    аты-жөні, телефон, e-mail, мекенжай, көлік құралының деректері, сақтандыру ақпараты, төлем және техникалық деректер.
    Деректер сақтандыру компанияларына, IT-мердігерлерге және қызмет көрсетуге қажетті өзге серіктестерге берілуі мүмкін.
    Пайдаланушының құқықтары:
    • деректерге қол жеткізу;
    • деректерді түзету немесе жою;
    • өңдеуді шектеу;
    • келісімді қайтарып алу;
    • PUODO органына шағым беру.
    Деректер әкімшісі полисті рәсімдеген сақтандыру компаниясы немесе SINEDIS Sp. z o.o. болуы мүмкін.
    Байланыс деректері:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - деректерді қорғау инспекторы
    Саясаттың толық нұсқасы:
    https://greencard.agency
    ________________________
    Жеке деректерді өңдеуге және беруге келісесіз бе?
