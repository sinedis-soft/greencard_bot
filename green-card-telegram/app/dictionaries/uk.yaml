    support: "👨‍💼 Зв’язок з оператором"

  answers:

    documents: |
      Для оформлення поліса знадобляться:

      • Паспорт або посвідчення особи власника;
      • Свідоцтво про реєстрацію транспортного засобу;
      • Реєстраційний номер автомобіля;
      • VIN-номер;
      • Контактний телефон;
      • E-mail для отримання поліса;
      • Дата початку страхування та строк страхування.

      Після отримання документів оператор перевірить дані та підготує поліс.

    payment: |
      Доступні такі способи оплати:

      • Переказ на польський банківський рахунок;
      • Переказ на польську банківську картку;
      • BLIK на польський номер телефону.

      Поліс оформлюється після підтвердження надходження оплати.

    coverage: |
      Поліс діє на території країн Європейського Союзу та Європейської економічної зони.

      Перед поїздкою обов’язково перевірте перелік країн, зазначених у вашому страховому сертифікаті.

    validity: |
      Страховий захист починає діяти з дати та часу, зазначених у полісі.

      Оформити страховку можна заздалегідь на майбутню дату, але не раніше ніж за 7 днів до початку дії покриття.

      Рекомендуємо оформлювати поліс щонайменше за кілька годин до перетину кордону. Дані про автомобіль передаються зі страхової компанії до UFG протягом від кількох годин до доби.

      ☝️Будь ласка, врахуйте! Не всі марки та моделі авто є в базі страхової компанії. Деякі автомобілі створені для країн СНД або США й не є популярними в ЄС. Такі авто можливо застрахувати лише у будні з 9:00 до 21:00 за варшавським часом та в суботу з 09:00 до 15:00.

    delivery: |
      Після оформлення та підтвердження оплати поліс надсилається на вказаний e-mail у форматі PDF.

      Рекомендується роздрукувати сертифікат у чорно-білому вигляді.

      Якщо лист не надійшов, перевірте папку «Спам» або зв’яжіться з оператором.

    border: |
      Під час перетину кордону рекомендується мати:

      • Роздрукований поліс;
      • Документи на автомобіль;
      • Паспорт або ID.

      Остаточне рішення щодо пропуску приймає прикордонна служба.

    accident: |
      У разі ДТП необхідно:

      • Забезпечити безпеку;
      • За потреби викликати поліцію;
      • Зафіксувати обставини події;
      • Повідомити страховика (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      Не залишайте місце ДТП без оформлення події.

    mistakes: |
      Перед підтвердженням заявки уважно перевірте:

      • VIN-номер;
      • Державний номер;
      • Тип транспортного засобу;
      • Дати страхування.

      Помилки можуть призвести до відмови у перетині кордону або проблем під час врегулювання збитків.

    refund: |
      Після випуску страхового поліса повернення страхової премії зазвичай неможливе.

      В окремих випадках питання повернення або анулювання розглядається страховиком індивідуально.

    whatis: |
      OC Graniczne — обов’язкове страхування цивільної відповідальності для транспортних засобів, зареєстрованих за межами ЄС.

      Поліс дозволяє законно пересуватися територією країн, зазначених у сертифікаті.
    
        nogreencard: |
      Green Card та OC Graniczne — це різні страхові продукти.

      Green Card оформлюється у країні реєстрації автомобіля.

      OC Graniczne використовується для в’їзду до ЄС за відсутності чинної Green Card.

    vehicles: |
      Оформлення можливе для:

      • Легкових автомобілів;
      • Вантажних автомобілів;
      • Автобусів;
      • Причепів;
      • Мотоциклів;
      • Спецтехніки.

      Можливість оформлення залежить від країни реєстрації та умов страховика.

    extension: |
      Як такого продовження поліса немає. Можливий лише випуск нового поліса.

    legalentity: |
      Поліс може бути оформлений лише на фізичну особу.

      Для корпоративних клієнтів поліс необхідно оформлювати на водія.

    online: |
      Оформлення повністю дистанційне.

      Документи приймаються онлайн, а готовий поліс надсилається електронною поштою.

    database: |
      Після оформлення дані поліса можуть відображатися у страхових базах не одразу.

      Оновлення інформації інколи займає до 24 годин.

      Перевірити поліс можна на сайті https://www.ufg.pl/

    restrictions: |
      Прикордонне страхування покриває лише цивільну відповідальність перед третіми особами.

      Збитки вашому власному автомобілю не покриваються.

    support: |
