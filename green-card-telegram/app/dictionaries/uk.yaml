faq:
  title: "Оберіть категорію FAQ"
  categories:
    documents: "Документи для оформлення"
    payment: "Оплата"
    coverage: "Покриття"
    mistakes: "На що звернути увагу"
    refund: "Повернення коштів"
  answers:
    documents: |
      Для оформлення поліса знадобляться такі дані: паспортні дані, дані транспортного засобу та інформація щодо строків дії страхування.
      Тому вам необхідно підготувати:
      - паспорт
      - свідоцтво про реєстрацію транспортного засобу
      - технічні дані автомобіля
      - номер телефону
      - e-Mail
    payment: |
      Доступно:
      - оплата переказом на польську картку,
      - оплата BLIK на номер телефону,
      - оплата переказом на польський банківський рахунок
    coverage: "Територія покриття: A - Австрія, B - Бельгія, BG - Болгарія, CY - Кіпр, CZ - Чехія, D - Німеччина, DK - Данія, E - Іспанія, EST - Естонія, F - Франція, FIN - Фінляндія, GR - Греція, H - Угорщина, HR - Хорватія, I - Італія, IRL - Ірландія, IS - Ісландія, L - Люксембург, LT - Литва, LV - Латвія, M - Мальта, N - Норвегія, NL - Нідерланди, P - Португалія, PL - Польща, RO - Румунія, S - Швеція, SK - Словаччина, SLO - Словенія, CH - Швейцарія."
    mistakes: "Будь ласка, двічі перевірте VIN, номерний знак і строк страхування перед відправленням. Внести зміни згодом буде неможливо!"
    refund: "Повернення коштів не здійснюється."

