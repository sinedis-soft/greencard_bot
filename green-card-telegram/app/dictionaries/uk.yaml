  ask_consent: |
    Політика обробки персональних даних SINEDIS
    SINEDIS Sp. z o.o. обробляє персональні дані відповідно до Регламенту ЄС 2016/679 (GDPR / RODO) та законодавства Польщі.
    Дані використовуються для:
    • розрахунку страхових пропозицій;
    • оформлення та супроводу страхових договорів;
    • зв’язку з клієнтом;
    • виконання вимог законодавства;
    • маркетингової комунікації за наявності згоди користувача.
    Можуть оброблятися:
    ім’я, телефон, e-mail, адреса, дані транспортного засобу, страхова інформація, платіжні та технічні дані.
    Дані можуть передаватися страховим компаніям, IT-підрядникам та іншим партнерам, необхідним для надання послуг.
    Користувач має право:
    • отримати доступ до даних;
    • виправити або видалити дані;
    • обмежити обробку;
    • відкликати згоду;
    • подати скаргу до PUODO.
    Адміністратором даних може виступати страхова компанія, яка оформила поліс, або SINEDIS Sp. z o.o.
    Контакти:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - інспектор із захисту даних
    Повна версія політики:
    https://greencard.agency
    ________________________
    Чи погоджуєтеся ви на обробку та передачу персональних даних?"
