  ask_consent: |
    SINEDIS Personal Data Processing Policy

    SINEDIS Sp. z o.o. processes personal data in accordance with EU Regulation 2016/679 (GDPR / RODO) and Polish law.

    The data is used for:
    • preparing insurance quotations;
    • issuing and servicing insurance contracts;
    • communication with the client;
    • compliance with legal obligations;
    • marketing communication where user consent has been granted.

    The following data may be processed:
    name, phone number, e-mail, address, vehicle data, insurance information, payment and technical data.

    Data may be shared with insurance companies, IT contractors, and other partners necessary for service provision.

    The user has the right to:
    • access their personal data;
    • correct or delete data;
    • restrict processing;
    • withdraw consent;
    • file a complaint with PUODO.

    The data controller may be either the insurance company issuing the policy or SINEDIS Sp. z o.o.

    Contact details:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - Data Protection Officer

    Full version of the policy:
    https://greencard.agency

    ________________________

    Do you consent to the processing and transfer of your personal data?

