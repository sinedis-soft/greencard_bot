    SINEDIS Personal Data Processing Policy

    SINEDIS Sp. z o.o. processes personal data in accordance with EU Regulation 2016/679 (GDPR / RODO) and the laws of the Republic of Poland.

    Personal data is used for:
    • preparing insurance quotations;
    • issuing and servicing insurance policies;
    • communication with the client;
    • compliance with legal obligations;
    • marketing communication, where the user has given consent.

    The following data may be processed:
    name, phone number, e-mail address, residential address, vehicle details, insurance information, payment information, and technical data.

    Personal data may be shared with insurance companies, IT service providers, and other partners required for the provision of services.

    The user has the right to:
    • access their personal data;
    • correct or delete their data;
    • restrict data processing;
    • withdraw consent;
    • lodge a complaint with the PUODO supervisory authority.

    The data controller may be either the insurance company issuing the policy or SINEDIS Sp. z o.o.

    Contact details:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Poland
    info@sinedis.pl
    odo@sinedis.pl - Data Protection Officer

    Full version of the policy:
    https://greencard.agency

    ________________________

    Do you agree to the processing and transfer of your personal data?

