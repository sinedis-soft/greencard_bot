faq:
  title: "Select an FAQ category"

  categories:
    documents: "📄 Documents"
    payment: "💳 Payment"
    coverage: "🌍 Coverage Area"
    validity: "📅 Policy Validity"
    delivery: "📧 Policy Delivery"
    border: "🛂 Border Crossing"
    accident: "🚗 Accident and Insurance Claim"
    mistakes: "⚠️ Important Information"
    refund: "↩️ Refund"
    whatis: "ℹ️ What is Europolis?"
    nogreencard: "🟢 Difference from Green Card"
    vehicles: "🚘 Vehicle Types"
    extension: "🔄 Policy Renewal"
    legalentity: "🏢 Legal Entities"
    online: "📱 Online Issuance"
    database: "🔍 Policy Verification"
    restrictions: "⛔ Restrictions"
    support: "👨‍💼 Contact an Operator"

  answers:

    documents: |
      The following documents are required to issue a policy:

      • Passport or ID document of the vehicle owner;
      • Vehicle registration certificate;
      • Vehicle registration number;
      • VIN number;
      • Contact phone number;
      • E-mail address for receiving the policy;
      • Insurance start date and coverage period.

      Once the documents are received, the operator will verify the information and prepare the policy.

    payment: |
      The following payment methods are available:

      • Bank transfer to a Polish bank account;
      • Transfer to a Polish bank card;
      • BLIK payment to a Polish phone number.

      The policy is issued after payment confirmation is received.

    coverage: |
      The policy is valid within the countries of the European Union and the European Economic Area.

      Before travelling, please make sure to check the list of countries specified in your insurance certificate.

    validity: |
      Insurance coverage becomes effective from the date and time specified in the policy.

      The policy may be issued in advance for a future date, but no earlier than 7 days before the coverage start date.

      We recommend arranging the policy at least several hours before crossing the border, as vehicle data may take from several hours up to one day to appear in the UFG system after being transmitted by the insurer.

      ☝️Please note! Not all vehicle makes and models are available in the insurance company database. Some vehicles manufactured specifically for CIS countries or the USA are uncommon within the EU. Such vehicles can only be insured on business days from 09:00 to 21:00 Warsaw time, and on Saturdays from 09:00 to 15:00.

    delivery: |
      Once the policy has been issued and payment confirmed, the policy will be sent to the specified e-mail address in PDF format.

      We recommend printing the certificate in black and white.

      If you have not received the e-mail, please check your Spam folder or contact the operator.

    border: |
      When crossing the border, it is recommended to have:

      • A printed copy of the policy;
      • Vehicle documents;
      • Passport or ID document.

      The final decision on entry is made by the border authorities.

    accident: |
      In the event of an accident, you should:

      • Ensure safety;
      • Call the police if necessary;
      • Document the circumstances of the accident;
      • Notify the insurer (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      Do not leave the scene of the accident without completing the required formalities.

    mistakes: |
      Before confirming the application, please carefully verify:

      • VIN number;
      • Vehicle registration number;
      • Vehicle type;
      • Insurance dates.

      Errors may result in refusal of border crossing or complications during claim settlement.

    refund: |
      After the insurance policy has been issued, a refund of the insurance premium is generally not possible.

      In certain cases, cancellation or refund requests may be reviewed individually by the insurer.

    whatis: |
      OC Graniczne is mandatory third-party liability insurance for vehicles registered outside the European Union.

      The policy allows the vehicle to travel legally within the countries listed in the insurance certificate.

    nogreencard: |
      Green Card and OC Graniczne are different insurance products.

      A Green Card is issued in the country where the vehicle is registered.

      OC Graniczne is used for entering the EU when there is no valid Green Card available.

    vehicles: |
      Policies can be issued for:

      • Passenger cars;
      • Trucks;
      • Buses;
      • Trailers;
      • Motorcycles;
      • Special-purpose vehicles.

      Availability depends on the country of registration and the insurer’s underwriting rules.

    extension: |
      There is no direct policy renewal.

      A new policy must be issued instead.

    legalentity: |
      The policy can only be issued to a private individual.

      For corporate clients, the policy must be issued in the driver’s name.

    online: |
      The entire process is fully remote.

      Documents are accepted online, and the completed policy is sent by e-mail.

    database: |
      After issuance, policy information may not appear in insurance databases immediately.

      Updating the information can sometimes take up to 24 hours.

      You can verify the policy on the following website:
      https://www.ufg.pl/

    restrictions: |
      Border insurance covers only third-party liability.

      Damage to your own vehicle is not covered.

    support: |
      If you have any questions regarding policy issuance, payment, or coverage, please contact the operator via Telegram or WhatsApp.


