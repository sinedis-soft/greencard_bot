  answers:

    documents: |
      Պոլիսի ձևակերպման համար անհրաժեշտ են՝

      • Սեփականատիրոջ անձնագիր կամ անձը հաստատող փաստաթուղթ,
      • Տրանսպորտային միջոցի գրանցման վկայական,
      • Ավտոմեքենայի պետհամարանիշ,
      • VIN համար,
      • Կոնտակտային հեռախոսահամար,
      • E-mail՝ պոլիսը ստանալու համար,
      • Ապահովագրության մեկնարկի ամսաթիվ և ժամկետ։

      Փաստաթղթերը ստանալուց հետո օպերատորը կստուգի տվյալները և կպատրաստի պոլիսը։

    payment: |
      Հասանելի են վճարման հետևյալ եղանակները՝

      • Փոխանցում լեհական բանկային հաշվին,
      • Փոխանցում լեհական բանկային քարտին,
      • BLIK՝ լեհական հեռախոսահամարին։

      Պոլիսը ձևակերպվում է վճարման հաստատումից հետո։

    coverage: |
      Պոլիսը գործում է Եվրոպական Միության և Եվրոպական տնտեսական գոտու երկրների տարածքում։

      Ճանապարհորդությունից առաջ պարտադիր ստուգեք ձեր ապահովագրական վկայագրում նշված երկրների ցանկը։

    validity: |
      Ապահովագրական պաշտպանությունը սկսում է գործել պոլիսում նշված ամսաթվից և ժամից։

      Ապահովագրությունը կարելի է ձևակերպել նախապես՝ ապագա ամսաթվի համար, բայց ոչ ավելի շուտ, քան ծածկույթի մեկնարկից 7 օր առաջ։

      Խորհուրդ ենք տալիս պոլիսը ձևակերպել առնվազն մի քանի ժամ առաջ սահմանը հատելուց։ Ավտոմեքենայի տվյալները ապահովագրական ընկերությունից UFG փոխանցվում են մի քանի ժամից մինչև մեկ օրվա ընթացքում։

      ☝️Խնդրում ենք հաշվի առնել։ Ոչ բոլոր ավտոմեքենաների մակնիշներն ու մոդելներն են առկա ապահովագրական ընկերության բազայում։ Որոշ մեքենաներ ստեղծված են ԱՊՀ երկրների կամ ԱՄՆ-ի համար և տարածված չեն ԵՄ-ում։ Այդպիսի մեքենաները հնարավոր է ապահովագրել միայն աշխատանքային օրերին՝ Վարշավայի ժամանակով 09:00-ից 21:00, և շաբաթ օրը՝ 09:00-ից 15:00։

    delivery: |
      Ձևակերպումից և վճարման հաստատումից հետո պոլիսը կուղարկվի նշված e-mail հասցեին՝ PDF ձևաչափով։

      Խորհուրդ է տրվում տպել վկայագիրը սև-սպիտակ տարբերակով։

      Եթե նամակը չի հասել, ստուգեք «Սպամ» պանակը կամ կապ հաստատեք օպերատորի հետ։

    border: |
      Սահմանը հատելիս խորհուրդ է տրվում ունենալ՝

      • Տպված պոլիս,
      • Ավտոմեքենայի փաստաթղթեր,
      • Անձնագիր կամ ID քարտ։

      Մուտքի վերջնական որոշումը կայացնում է սահմանապահ ծառայությունը։

    accident: |
      Վթարի դեպքում անհրաժեշտ է՝

      • Ապահովել անվտանգությունը,
      • Անհրաժեշտության դեպքում կանչել ոստիկանություն,
      • Ֆիքսել պատահարի հանգամանքները,
      • Տեղեկացնել ապահովագրողին (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu)։

      Մի լքեք վթարի վայրը մինչև դեպքի պաշտոնական ձևակերպումը։

    mistakes: |
      Հայտը հաստատելուց առաջ ուշադիր ստուգեք՝

      • VIN համարը,
      • Պետհամարանիշը,
      • Տրանսպորտային միջոցի տեսակը,
      • Ապահովագրության ամսաթվերը։

      Սխալները կարող են հանգեցնել սահմանի հատման մերժման կամ վնասի կարգավորման խնդիրների։

    refund: |
      Ապահովագրական պոլիսի թողարկումից հետո ապահովագրավճարի վերադարձը սովորաբար հնարավոր չէ։

      Առանձին դեպքերում վերադարձի կամ չեղարկման հարցը դիտարկվում է ապահովագրողի կողմից անհատական կարգով։

    whatis: |
      OC Graniczne-ը քաղաքացիական պատասխանատվության պարտադիր ապահովագրություն է ԵՄ-ից դուրս գրանցված տրանսպորտային միջոցների համար։

      Պոլիսը թույլ է տալիս օրինական կերպով տեղաշարժվել վկայագրում նշված երկրների տարածքում։
    
        nogreencard: |
      Green Card-ը և OC Graniczne-ը տարբեր ապահովագրական պրոդուկտներ են։

      Green Card-ը ձևակերպվում է ավտոմեքենայի գրանցման երկրում։

      OC Graniczne-ը օգտագործվում է ԵՄ մուտք գործելու համար, եթե գործող Green Card չկա։

    vehicles: |
      Ձևակերպումը հնարավոր է հետևյալների համար՝

      • Թեթև մարդատար ավտոմեքենաներ,
      • Բեռնատար ավտոմեքենաներ,
      • Ավտոբուսներ,
      • Կցորդներ,
      • Մոտոցիկլներ,
      • Հատուկ տեխնիկա։

      Ձևակերպման հնարավորությունը կախված է գրանցման երկրից և ապահովագրողի պայմաններից։

    extension: |
      Պոլիսի երկարաձգում որպես այդպիսին գոյություն չունի։

      Հնարավոր է միայն նոր պոլիսի ձևակերպում։

    legalentity: |
      Պոլիսը կարող է ձևակերպվել միայն ֆիզիկական անձի վրա։

      Կորպորատիվ հաճախորդների դեպքում պոլիսը պետք է ձևակերպվի վարորդի անունով։

    online: |
      Ձևակերպումն ամբողջությամբ իրականացվում է հեռավար։

      Փաստաթղթերն ընդունվում են առցանց, իսկ պատրաստի պոլիսն ուղարկվում է էլեկտրոնային փոստով։

    database: |
      Ձևակերպումից հետո պոլիսի տվյալները կարող են անմիջապես չերևալ ապահովագրական բազաներում։

      Տեղեկատվության թարմացումը երբեմն կարող է տևել մինչև 24 ժամ։

      Պոլիսը կարելի է ստուգել հետևյալ կայքում՝ https://www.ufg.pl/

    restrictions: |
      Սահմանային ապահովագրությունը ծածկում է միայն քաղաքացիական պատասխանատվությունը երրորդ անձանց նկատմամբ։

      Ձեր սեփական ավտոմեքենային հասցված վնասը չի ծածկվում։

    support: |
      Եթե ունեք հարցեր ձևակերպման, վճարման կամ պոլիսի գործողության վերաբերյալ, կապ հաստատեք օպերատորի հետ Telegram-ի կամ WhatsApp-ի միջոցով։

