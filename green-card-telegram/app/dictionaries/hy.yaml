  ask_consent: |
    SINEDIS-ի անձնական տվյալների մշակման քաղաքականություն

    SINEDIS Sp. z o.o.-ն մշակում է անձնական տվյալները՝ համաձայն ԵՄ 2016/679 կանոնակարգի (GDPR / RODO) և Լեհաստանի օրենսդրության։

    Տվյալներն օգտագործվում են՝
    • ապահովագրական առաջարկների հաշվարկի համար,
    • ապահովագրական պայմանագրերի ձևակերպման և սպասարկման համար,
    • հաճախորդի հետ կապ հաստատելու համար,
    • օրենսդրական պահանջների կատարման համար,
    • մարքեթինգային հաղորդակցության համար՝ օգտատիրոջ համաձայնության առկայության դեպքում։

    Կարող են մշակվել՝
    անուն, հեռախոսահամար, e-mail, հասցե, տրանսպորտային միջոցի տվյալներ, ապահովագրական տեղեկատվություն, վճարային և տեխնիկական տվյալներ։

    Տվյալները կարող են փոխանցվել ապահովագրական ընկերություններին, IT կապալառուներին և այլ գործընկերներին, որոնք անհրաժեշտ են ծառայությունների մատուցման համար։

    Օգտատերն իրավունք ունի՝
    • ստանալ հասանելիություն իր տվյալներին,
    • ուղղել կամ ջնջել տվյալները,
    • սահմանափակել մշակումը,
    • հետ վերցնել համաձայնությունը,
    • բողոք ներկայացնել PUODO։

