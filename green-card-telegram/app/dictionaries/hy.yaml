    SINEDIS անձնական տվյալների մշակման քաղաքականություն
    SINEDIS Sp. z o.o.-ն մշակում է անձնական տվյալները՝ համաձայն ԵՄ 2016/679 կանոնակարգի (GDPR / RODO) և Լեհաստանի օրենսդրության։
    Տվյալներն օգտագործվում են՝
    • ապահովագրական առաջարկների հաշվարկման համար,
    • ապահովագրական պայմանագրերի ձևակերպման և սպասարկման համար,
    • հաճախորդի հետ կապի համար,
    • օրենսդրական պահանջների կատարման համար,
    • մարքեթինգային հաղորդակցության համար՝ օգտատիրոջ համաձայնության դեպքում։
    Կարող են մշակվել՝
    անուն, հեռախոս, e-mail, հասցե, տրանսպորտային միջոցի տվյալներ, ապահովագրական տեղեկություններ, վճարային և տեխնիկական տվյալներ։
    Տվյալները կարող են փոխանցվել ապահովագրական ընկերություններին, IT կապալառուներին և այլ գործընկերներին, որոնք անհրաժեշտ են ծառայությունների մատուցման համար։
    Օգտատերն իրավունք ունի՝
    • ստանալ հասանելիություն տվյալներին,
    • ուղղել կամ ջնջել տվյալները,
    • սահմանափակել մշակումը,
    • հետ կանչել համաձայնությունը,
    • բողոք ներկայացնել PUODO։
    Տվյալների ադմինիստրատոր կարող է լինել ապահովագրական ընկերությունը, որը ձևակերպել է պոլիսը, կամ SINEDIS Sp. z o.o.-ն։
