faq:
  title: "Ընտրեք FAQ բաժինը"
  categories:
    documents: "Փաստաթղթեր ձևակերպման համար"
    payment: "Վճարում"
    coverage: "Ծածկույթ"
    mistakes: "Ուշադրություն դարձնել"
    refund: "Վերադարձ"
  answers:
    documents: |
      Պոլիսի ձևակերպման համար անհրաժեշտ են հետևյալ տվյալները՝ անձնագրային տվյալներ, տրանսպորտային միջոցի տվյալներ և ապահովագրության գործողության ժամկետների տվյալներ
      Ուստի անհրաժեշտ է պատրաստել՝
      - անձնագիր
      - տրանսպորտային միջոցի գրանցման վկայական
      - ավտոմեքենայի տեխնիկական տվյալներ
      - հեռախոսահամար
      - e-Mail
    payment: |
      Հասանելի է՝
      - վճարում փոխանցումով լեհական քարտին, 
      - վճարում BLIK-ով հեռախոսահամարին, 
      - վճարում փոխանցումով լեհական հաշվարկային հաշվին"
    coverage: "Ծածկույթի տարածք՝ A - Ավստրիա, B - Բելգիա, BG - Բուլղարիա, CY - Կիպրոս, CZ - Չեխիա, D - Գերմանիա, DK - Դանիա, E - Իսպանիա, EST - Էստոնիա, F - Ֆրանսիա, FIN - Ֆինլանդիա, GR - Հունաստան, H - Հունգարիա, HR - Խորվաթիա, I - Իտալիա, IRL - Իռլանդիա, IS - Իսլանդիա, L - Լյուքսեմբուրգ, LT - Լիտվա, LV - Լատվիա, M - Մալթա, N - Նորվեգիա, NL - Նիդերլանդներ, P - Պորտուգալիա, PL - Լեհաստան, RO - Ռումինիա, S - Շվեդիա, SK - Սլովակիա, SLO - Սլովենիա, CH - Շվեյցարիա։"
    mistakes: "Խնդրում ենք ուղարկելուց առաջ կրկնակի ստուգել VIN-ը, համարանիշը և ապահովագրության ժամկետը։ Հետագայում ուղղումներ կատարել հնարավոր չի լինի։"
    refund: "Գումարի վերադարձ չի իրականացվում։"

