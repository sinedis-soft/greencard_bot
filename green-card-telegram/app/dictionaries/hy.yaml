  ask_consent: |
    SINEDIS-ի անձնական տվյալների մշակման քաղաքականություն
    SINEDIS Sp. z o.o.-ն մշակում է անձնական տվյալները ԵՄ 2016/679 կանոնակարգին (GDPR / RODO) և Լեհաստանի օրենսդրությանը համապատասխան։
    Տվյալներն օգտագործվում են՝
    • ապահովագրական առաջարկների հաշվարկի համար;
    • ապահովագրական պայմանագրերի ձևակերպման և սպասարկման համար;
    • հաճախորդի հետ կապ հաստատելու համար;
    • օրենսդրության պահանջները կատարելու համար;
    • մարքեթինգային հաղորդակցության համար՝ օգտագործողի համաձայնության առկայության դեպքում։
    Կարող են մշակվել՝
    անուն, հեռախոս, e-mail, հասցե, տրանսպորտային միջոցի տվյալներ, ապահովագրական տեղեկություն, վճարային և տեխնիկական տվյալներ։
    Տվյալները կարող են փոխանցվել ապահովագրական ընկերություններին, IT կապալառուներին և այլ գործընկերներին, որոնք անհրաժեշտ են ծառայությունների մատուցման համար։
    Օգտագործողն ունի իրավունք՝
    • ստանալ տվյալներին հասանելիություն;
    • ուղղել կամ ջնջել տվյալները;
    • սահմանափակել մշակումը;
    • հետ կանչել համաձայնությունը;
    • բողոք ներկայացնել PUODO-ին։
    Տվյալների ադմինիստրատոր կարող է լինել պոլիսը ձևակերպած ապահովագրական ընկերությունը կամ SINEDIS Sp. z o.o.-ն։
