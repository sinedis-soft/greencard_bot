faq:
  title: "Ընտրեք FAQ կատեգորիա"
  categories:
    documents: "Փաստաթղթեր ձևակերպման համար"
    payment: "Վճարում"
    coverage: "Ծածկույթ"
    mistakes: "Ուշադրություն դարձրեք"
    refund: "Վերադարձ"
  answers:
    documents: |
      Պոլիսի ձևակերպման համար անհրաժեշտ են հետևյալ տվյալները՝ անձնագրային տվյալներ, տրանսպորտային միջոցի տվյալներ և ապահովագրության ժամկետների տվյալներ։
      Այդ պատճառով անհրաժեշտ է պատրաստել՝
      - անձնագիր
      - տրանսպորտային միջոցի գրանցման վկայական
      - ավտոմեքենայի տեխնիկական տվյալներ
      - հեռախոսահամար
      - e-Mail
    payment: |
      Հասանելի է՝
      - վճարում լեհական քարտին փոխանցմամբ,
      - վճարում BLIK-ով հեռախոսահամարին,
      - վճարում լեհական հաշվեհամարին փոխանցմամբ
    coverage: "Ծածկույթի տարածք՝ A - Ավստրիա, B - Բելգիա, BG - Բուլղարիա, CY - Կիպրոս, CZ - Չեխիա, D - Գերմանիա, DK - Դանիա, E - Իսպանիա, EST - Էստոնիա, F - Ֆրանսիա, FIN - Ֆինլանդիա, GR - Հունաստան, H - Հունգարիա, HR - Խորվաթիա, I - Իտալիա, IRL - Իռլանդիա, IS - Իսլանդիա, L - Լյուքսեմբուրգ, LT - Լիտվա, LV - Լատվիա, M - Մալթա, N - Նորվեգիա, NL - Նիդերլանդներ, P - Պորտուգալիա, PL - Լեհաստան, RO - Ռումինիա, S - Շվեդիա, SK - Սլովակիա, SLO - Սլովենիա, CH - Շվեյցարիա։"
    mistakes: "Խնդրում ենք կրկնակի ստուգել VIN-ը, պետհամարանիշը և ապահովագրության ժամկետը նախքան ուղարկելը։ Հետագայում փոփոխություններ անել հնարավոր չի լինի։"
    refund: "Գումարի վերադարձ չի իրականացվում։"

coverage:
