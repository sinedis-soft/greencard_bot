    legalentity: "🏢 Хуулийн этгээд"
    online: "📱 Онлайн бүртгэл"
    database: "🔍 Полис шалгах"
    restrictions: "⛔ Хязгаарлалт"
    support: "👨‍💼 Оператортой холбогдох"

  answers:

    documents: |
      Полис гаргахад дараах мэдээлэл шаардлагатай:

      • Эзэмшигчийн паспорт эсвэл иргэний үнэмлэх;
      • Тээврийн хэрэгслийн гэрчилгээ;
      • Автомашины улсын дугаар;
      • VIN дугаар;
      • Холбоо барих утас;
      • Полис хүлээн авах e-mail;
      • Даатгал эхлэх огноо болон хугацаа.

      Баримт хүлээн авсны дараа оператор мэдээллийг шалгаж, полис бэлтгэнэ.

    payment: |
      Дараах төлбөрийн аргууд боломжтой:

      • Польшийн банкны данс руу шилжүүлэг;
      • Польшийн банкны карт руу шилжүүлэг;
      • Польш дугаар руу BLIK төлбөр.

          
      Төлбөр орсны баталгаажуулалтын дараа полис гарна.

    coverage: |
      Полис нь Европын Холбоо болон Европын эдийн засгийн бүсийн орнуудад хүчинтэй.

      Аялал эхлэхээс өмнө даатгалын гэрчилгээнд заасан орнуудын жагсаалтыг заавал шалгана уу.

    validity: |
      Даатгалын хамгаалалт полист заасан огноо, цагаас эхэлнэ.

      Даатгалыг ирээдүйн огноонд урьдчилан хийлгэж болох боловч даатгал эхлэхээс 7 хоногоос өмнө биш байна.

      Хил нэвтрэхээс хэдэн цагийн өмнө полисоо гаргуулахыг зөвлөж байна. Учир нь автомашины мэдээлэл даатгалын компаниас UFG системд хэдэн цагаас нэг хоногийн дотор дамждаг.

      ☝️Анхаарна уу! Зарим автомашины марк, загварууд даатгалын компанийн мэдээллийн санд байдаггүй. Тухайлбал ТУХН орнууд эсвэл АНУ-ын зах зээлд зориулсан автомашинууд ЕХ-д түгээмэл биш байж болно. Ийм автомашиныг зөвхөн ажлын өдрүүдэд Варшавын цагаар 09:00–21:00, бямба гарагт 09:00–15:00 цагийн хооронд даатгах боломжтой.

    delivery: |
      Полис гарч, төлбөр баталгаажсаны дараа PDF хэлбэрээр заасан e-mail хаяг руу илгээгдэнэ.

      Сертификатыг хар цагаанаар хэвлэж авахыг зөвлөж байна.

      Хэрэв захидал ирээгүй бол “Spam” хавтсаа шалгах эсвэл оператортой холбогдоно уу.

    border: |
      Хил нэвтрэх үед дараах зүйлсийг авч явахыг зөвлөж байна:

      • Хэвлэсэн полис;
      • Автомашины баримт бичиг;
      • Паспорт эсвэл ID.

      Хилээр нэвтрүүлэх эцсийн шийдвэрийг хилийн алба гаргадаг.

    accident: |
      Зам тээврийн ослын үед дараах арга хэмжээг авна:

      • Аюулгүй байдлыг хангах;
      • Шаардлагатай бол цагдаа дуудах;
      • Осол болсон нөхцөл байдлыг тэмдэглэх;
      • Даатгагчид мэдэгдэх (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      Ослыг бүртгүүлэлгүйгээр хэргийн газрыг орхиж болохгүй.

    mistakes: |
      Хүсэлт баталгаажуулахын өмнө дараах мэдээллийг сайтар шалгана уу:

      • VIN дугаар;
      • Улсын дугаар;
      • Тээврийн хэрэгслийн төрөл;
      • Даатгалын огноо.

      Алдаа нь хил нэвтрэхээс татгалзах эсвэл нөхөн төлбөр шийдвэрлэхэд асуудал үүсгэж болзошгүй.

    refund: |
      Даатгалын полис гарсны дараа даатгалын шимтгэлийг буцаах нь ихэвчлэн боломжгүй байдаг.

      Зарим онцгой тохиолдолд буцаалт эсвэл хүчингүй болгох асуудлыг даатгагч тус бүрээр нь авч үздэг.

    whatis: |
      OC Graniczne нь ЕХ-ноос гадуур бүртгэлтэй тээврийн хэрэгсэлд зориулсан иргэний хариуцлагын заавал даатгал юм.

      Энэхүү полис нь сертификатад заасан орнуудын нутаг дэвсгэрт хууль ёсоор зорчих боломж олгодог.
        nogreencard: |
      Green Card болон OC Graniczne нь өөр өөр даатгалын бүтээгдэхүүнүүд юм.

      Green Card нь автомашин бүртгэлтэй улсад олгогддог.

      OC Graniczne нь хүчинтэй Green Card байхгүй тохиолдолд ЕХ руу нэвтрэхэд ашиглагддаг.

    vehicles: |
      Дараах тээврийн хэрэгслүүдэд даатгал хийх боломжтой:

      • Суудлын автомашин;
      • Ачааны автомашин;
      • Автобус;
      • Чиргүүл;
      • Мотоцикл;
      • Тусгай зориулалтын техник.

      Даатгал хийх боломж нь автомашины бүртгэлийн улс болон даатгагчийн нөхцлөөс хамаарна.

    extension: |
      Полис сунгах гэсэн ойлголт байхгүй.

      Зөвхөн шинэ полис гаргадаг.

    legalentity: |
      Полис зөвхөн хувь хүний нэр дээр гарна.

      Байгууллагын хэрэглэгчдийн хувьд полисыг жолоочийн нэр дээр гаргах шаардлагатай.

    online: |
      Бүртгэл бүрэн онлайн явагдана.

      Баримтуудыг онлайнаар хүлээн авч, бэлэн болсон полисыг e-mail хаягаар илгээнэ.

    database: |
      Полис гарсны дараа мэдээлэл даатгалын мэдээллийн санд шууд харагдахгүй байж болно.

      Мэдээлэл шинэчлэгдэхэд заримдаа 24 цаг хүртэл хугацаа шаардлагатай.

      Полисыг дараах сайтаар шалгаж болно:
      https://www.ufg.pl/

    restrictions: |
      Хилийн даатгал нь зөвхөн гуравдагч этгээдийн өмнөх иргэний хариуцлагыг нөхөн төлдөг.

      Таны өөрийн автомашинд учирсан хохирол нөхөн төлөгдөхгүй.

    support: |
      Хэрэв бүртгэл, төлбөр эсвэл полисын хүчинтэй холбоотой асуулт гарвал Telegram эсвэл WhatsApp-аар оператортой холбогдоно уу.

coverage:
  text: |
    OC graniczne (border insurance) даатгалын хамрах хүрээний газрын зураг.
    Аялал эхлэхээс өмнө полистоо заасан улсын кодыг шалгана уу.
