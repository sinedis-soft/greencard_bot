  ask_consent: |
    SINEDIS компанийн хувийн мэдээлэл боловсруулах бодлого
    SINEDIS Sp. z o.o. нь хувийн мэдээллийг ЕХ-ны 2016/679 тоот журам (GDPR / RODO) болон Польш улсын хууль тогтоомжийн дагуу боловсруулдаг.
    Мэдээллийг дараах зорилгоор ашиглана:
    • даатгалын санал тооцоолох;
    • даатгалын гэрээ байгуулах болон хөтлөх;
    • хэрэглэгчтэй холбоо барих;
    • хууль тогтоомжийн шаардлага биелүүлэх;
    • хэрэглэгчийн зөвшөөрөлтэй тохиолдолд маркетингийн мэдээлэл хүргэх.
    Дараах мэдээллийг боловсруулж болно:
    нэр, утас, e-mail, хаяг, тээврийн хэрэгслийн мэдээлэл, даатгалын мэдээлэл, төлбөрийн болон техникийн мэдээлэл.
    Мэдээллийг даатгалын компаниуд, IT үйлчилгээ үзүүлэгчид болон үйлчилгээ үзүүлэхэд шаардлагатай бусад түншүүдэд дамжуулж болно.
    Хэрэглэгч дараах эрхтэй:
    • мэдээлэлтэй танилцах;
    • мэдээллээ засах эсвэл устгуулах;
    • боловсруулалтыг хязгаарлуулах;
    • зөвшөөрлөө цуцлах;
    • PUODO байгууллагад гомдол гаргах.
    Мэдээлэл хариуцагч нь даатгалын полис гаргасан даатгалын компани эсвэл SINEDIS Sp. z o.o. байж болно.
    Холбоо барих:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - мэдээлэл хамгааллын ажилтан
    Бодлогын бүрэн хувилбар:
    https://greencard.agency
    ________________________
    Хувийн мэдээллийг боловсруулах болон дамжуулахыг зөвшөөрч байна уу?"
