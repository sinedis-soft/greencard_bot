faq:
  title: "FAQ ангиллыг сонгоно уу"
  categories:
    documents: "Оформлоход шаардагдах баримт бичиг"
    payment: "Төлбөр"
    coverage: "Хамрах хүрээ"
    mistakes: "Анхаарах зүйл"
    refund: "Буцаалт"
  answers:
    documents: |
      Полис оформлоход дараах мэдээлэл шаардлагатай: паспортын мэдээлэл, тээврийн хэрэгслийн мэдээлэл болон даатгалын хүчинтэй хугацааны огноо
      Тиймээс та дараах зүйлсийг бэлтгэх шаардлагатай:
      - паспорт
      - тээврийн хэрэгслийн бүртгэлийн гэрчилгээ
      - автомашины техникийн мэдээлэл
      - утасны дугаар
      - e-Mail
    payment: |
      Боломжтой:
      - Польш карт руу шилжүүлгээр төлөх, 
      - утасны дугаарт BLIK-ээр төлөх, 
      - Польшийн банкны данс руу шилжүүлгээр төлөх"
    coverage: "Хамрах нутаг дэвсгэр: A - Австри, B - Бельги, BG - Болгар, CY - Кипр, CZ - Чех, D - Герман, DK - Дани, E - Испани, EST - Эстони, F - Франц, FIN - Финланд, GR - Грек, H - Унгар, HR - Хорват, I - Итали, IRL - Ирланд, IS - Исланд, L - Люксембург, LT - Литва, LV - Латви, M - Мальта, N - Норвеги, NL - Нидерланд, P - Португал, PL - Польш, RO - Румын, S - Швед, SK - Словак, SLO - Словени, CH - Швейцар."
    mistakes: "Илгээхээс өмнө VIN, улсын дугаар болон даатгалын хугацааг хоёр удаа шалгана уу. Дараа нь засвар оруулах боломжгүй!"
    refund: "Мөнгө буцаан олгохгүй."

