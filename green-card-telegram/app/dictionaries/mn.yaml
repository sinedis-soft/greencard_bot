  ask_consent: |
    SINEDIS-ийн хувийн мэдээлэл боловсруулах бодлого
    SINEDIS Sp. z o.o. нь хувийн мэдээллийг ЕХ-ны 2016/679 журам (GDPR / RODO) болон Польшийн хууль тогтоомжийн дагуу боловсруулдаг.
    Мэдээллийг дараах зорилгоор ашиглана:
    • даатгалын санал тооцоолох;
    • даатгалын гэрээ оформлох болон дагалдан үйлчилгээ үзүүлэх;
    • үйлчлүүлэгчтэй холбоо барих;
    • хууль тогтоомжийн шаардлагыг биелүүлэх;
    • хэрэглэгчийн зөвшөөрөлтэй үед маркетингийн харилцаа явуулах.
    Дараах мэдээлэл боловсруулагдаж болно:
    нэр, утас, e-mail, хаяг, тээврийн хэрэгслийн мэдээлэл, даатгалын мэдээлэл, төлбөрийн болон техникийн мэдээлэл.
    Мэдээллийг үйлчилгээ үзүүлэхэд шаардлагатай даатгалын компаниуд, IT гүйцэтгэгчид болон бусад түншүүдэд дамжуулж болно.
    Хэрэглэгч дараах эрхтэй:
    • мэдээлэлд хандах;
    • мэдээллийг засах эсвэл устгах;
    • боловсруулалтыг хязгаарлах;
    • зөвшөөрлөө буцаах;
    • PUODO-д гомдол гаргах.
    Мэдээллийн администратор нь полис оформлосон даатгалын компани эсвэл SINEDIS Sp. z o.o. байж болно.
    Холбоо барих:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - мэдээлэл хамгаалах байцаагч
    Бодлогын бүрэн хувилбар:
    https://greencard.agency
    ________________________
    Та хувийн мэдээллийг боловсруулах болон дамжуулахыг зөвшөөрч байна уу?"
