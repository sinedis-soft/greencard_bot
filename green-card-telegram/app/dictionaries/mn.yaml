faq:
  title: "FAQ ангиллыг сонгоно уу"

  categories:
    documents: "Бүрдүүлэх баримт"
    payment: "Төлбөр"
    coverage: "Хамрах хүрээ"
    mistakes: "Анхаарах зүйлс"
    refund: "Буцаан олголт"

  answers:
    documents: |
      Полис бүрдүүлэхэд дараах мэдээлэл шаардлагатай:
      паспортын мэдээлэл, тээврийн хэрэгслийн мэдээлэл болон даатгалын хугацааны мэдээлэл.
      Иймээс дараахыг бэлдэнэ үү:
      - паспорт
      - тээврийн хэрэгслийн бүртгэлийн гэрчилгээ
      - автомашины техникийн мэдээлэл
      - утасны дугаар
      - e-Mail

    payment: |
      Боломжтой төлбөрийн аргууд:
      - Польш банкны карт руу шилжүүлэг,
      - утасны дугаараар BLIK төлбөр,
      - Польш банкны данс руу шилжүүлэг

    coverage: "Хамрах бүс: A - Австри, B - Бельги, BG - Болгар, CY - Кипр, CZ - Чех, D - Герман, DK - Дани, E - Испани, EST - Эстони, F - Франц, FIN - Финланд, GR - Грек, H - Унгар, HR - Хорват, I - Итали, IRL - Ирланд, IS - Исланд, L - Люксембург, LT - Литва, LV - Латви, M - Мальта, N - Норвеги, NL - Нидерланд, P - Португал, PL - Польш, RO - Румын, S - Швед, SK - Словак, SLO - Словени, CH - Швейцар."

    mistakes: "Илгээхээс өмнө VIN, улсын дугаар болон даатгалын хугацааг давхар шалгана уу. Дараа нь засвар хийх боломжгүй!"

    refund: "Буцаан олголт хийгдэхгүй."

