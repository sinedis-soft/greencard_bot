    support: "👨‍💼 ოპერატორთან დაკავშირება"

  answers:

    documents: |
      პოლისის გასაფორმებლად საჭირო იქნება:

      • მფლობელის პასპორტი ან პირადობის დამადასტურებელი დოკუმენტი;
      • სატრანსპორტო საშუალების რეგისტრაციის მოწმობა;
      • ავტომობილის სახელმწიფო ნომერი;
      • VIN-ნომერი;
      • საკონტაქტო ტელეფონი;
      • E-mail პოლისის მისაღებად;
      • დაზღვევის დაწყების თარიღი და ვადა.

      დოკუმენტების მიღების შემდეგ ოპერატორი გადაამოწმებს მონაცემებს და მოამზადებს პოლისს.

    payment: |
      ხელმისაწვდომია გადახდის შემდეგი მეთოდები:

      • გადარიცხვა პოლონურ საბანკო ანგარიშზე;
      • გადარიცხვა პოლონურ საბანკო ბარათზე;
      • BLIK პოლონურ ტელეფონის ნომერზე.

      პოლისი ფორმდება გადახდის მიღების დადასტურების შემდეგ.

    coverage: |
      პოლისი მოქმედებს ევროკავშირის და ევროპის ეკონომიკური ზონის ქვეყნების ტერიტორიაზე.

      გამგზავრებამდე აუცილებლად გადაამოწმეთ იმ ქვეყნების სია, რომლებიც მითითებულია თქვენს სადაზღვევო სერტიფიკატში.

    validity: |
      სადაზღვევო დაცვა ძალაში შედის პოლისში მითითებული თარიღისა და დროის მიხედვით.

      დაზღვევის გაფორმება შესაძლებელია წინასწარ მომავალ თარიღზე, თუმცა არაუადრეს დაზღვევის დაწყებამდე 7 დღისა.

      რეკომენდებულია პოლისის გაფორმება საზღვრის გადაკვეთამდე მინიმუმ რამდენიმე საათით ადრე, რადგან ავტომობილის მონაცემების გადაცემა სადაზღვევო კომპანიიდან UFG-ში შეიძლება გაგრძელდეს რამდენიმე საათიდან ერთ დღემდე.

      ☝️გთხოვთ გაითვალისწინოთ! ავტომობილის ყველა მარკა და მოდელი არ არის სადაზღვევო კომპანიის ბაზაში. ზოგიერთი ავტომობილი შექმნილია დსთ-ს ქვეყნებისთვის ან აშშ-სთვის და ევროკავშირში ნაკლებად გავრცელებულია. ასეთი ავტომობილების დაზღვევა შესაძლებელია მხოლოდ სამუშაო დღეებში 09:00-21:00 საათამდე ვარშავის დროით და შაბათს 09:00-15:00 საათამდე.

    delivery: |
      გაფორმებისა და გადახდის დადასტურების შემდეგ პოლისი იგზავნება მითითებულ e-mail-ზე PDF ფორმატში.

      რეკომენდებულია სერტიფიკატის შავ-თეთრად ამობეჭდვა.

      თუ წერილი არ მიგიღიათ, გადაამოწმეთ „სპამის“ საქაღალდე ან დაუკავშირდით ოპერატორს.

    border: |
      საზღვრის გადაკვეთისას რეკომენდებულია თან იქონიოთ:

      • ამობეჭდილი პოლისი;
      • ავტომობილის დოკუმენტები;
      • პასპორტი ან ID ბარათი.

      ქვეყანაში შეშვების საბოლოო გადაწყვეტილებას იღებს სასაზღვრო სამსახური.

    accident: |
      ДТП-ის შემთხვევაში საჭიროა:

      • უსაფრთხოების უზრუნველყოფა;
      • საჭიროების შემთხვევაში პოლიციის გამოძახება;
      • შემთხვევის გარემოებების დაფიქსირება;
      • მზღვეველის ინფორმირება (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      არ დატოვოთ შემთხვევის ადგილი ოფიციალური გაფორმების გარეშე.

    mistakes: |
      განაცხადის დადასტურებამდე ყურადღებით გადაამოწმეთ:

      • VIN-ნომერი;
      • სახელმწიფო ნომერი;
      • სატრანსპორტო საშუალების ტიპი;
      • დაზღვევის თარიღები.

      შეცდომებმა შეიძლება გამოიწვიოს საზღვრის გადაკვეთაზე უარი ან პრობლემები ზარალის ანაზღაურებისას.

    refund: |
      სადაზღვევო პოლისის გაცემის შემდეგ სადაზღვევო პრემიის დაბრუნება, როგორც წესი, შეუძლებელია.

      ცალკეულ შემთხვევებში თანხის დაბრუნების ან პოლისის გაუქმების საკითხს მზღვეველი ინდივიდუალურად განიხილავს.

    whatis: |
      OC Graniczne — სავალდებულო სამოქალაქო პასუხისმგებლობის დაზღვევაა იმ სატრანსპორტო საშუალებებისთვის, რომლებიც ევროკავშირის ფარგლებს გარეთ არიან რეგისტრირებული.

      პოლისი საშუალებას გაძლევთ კანონიერად გადაადგილდეთ სერტიფიკატში მითითებული ქვეყნების ტერიტორიაზე.

        nogreencard: |
      Green Card და OC Graniczne — სხვადასხვა სადაზღვევო პროდუქტებია.

      Green Card ფორმდება ავტომობილის რეგისტრაციის ქვეყანაში.

      OC Graniczne გამოიყენება ევროკავშირში შესასვლელად მოქმედი Green Card-ის არარსებობის შემთხვევაში.

    vehicles: |
      გაფორმება შესაძლებელია:

      • მსუბუქი ავტომობილებისთვის;
      • სატვირთო ავტომობილებისთვის;
      • ავტობუსებისთვის;
      • მისაბმელებისთვის;
      • მოტოციკლებისთვის;
      • სპეციალური ტექნიკისთვის.

      გაფორმების შესაძლებლობა დამოკიდებულია რეგისტრაციის ქვეყანასა და მზღვეველის პირობებზე.

    extension: |
      პოლისის პირდაპირი გაგრძელება არ არსებობს.

      შესაძლებელია მხოლოდ ახალი პოლისის გაფორმება.

    legalentity: |
      პოლისი შეიძლება გაფორმდეს მხოლოდ ფიზიკურ პირზე.

      კორპორატიული კლიენტებისთვის პოლისი უნდა გაფორმდეს მძღოლზე.

    online: |
      გაფორმება სრულად დისტანციურად ხდება.

      დოკუმენტები მიიღება ონლაინ, ხოლო მზა პოლისი იგზავნება ელექტრონულ ფოსტაზე.

    database: |
      გაფორმების შემდეგ პოლისის მონაცემები სადაზღვევო ბაზებში შესაძლოა დაუყოვნებლივ არ გამოჩნდეს.

      ინფორმაციის განახლებას ზოგჯერ 24 საათამდე სჭირდება.

      პოლისის შემოწმება შესაძლებელია ვებგვერდზე:
      https://www.ufg.pl/

    restrictions: |
      სასაზღვრო დაზღვევა ფარავს მხოლოდ მესამე პირების წინაშე სამოქალაქო პასუხისმგებლობას.

      თქვენი საკუთარი ავტომობილის დაზიანება არ ანაზღაურდება.

    support: |
      თუ გაქვთ კითხვები პოლისის გაფორმების, გადახდის ან მოქმედების შესახებ, დაუკავშირდით ოპერატორს Telegram-ის ან WhatsApp-ის საშუალებით.

coverage:
  text: |
    OC graniczne (border insurance) დაფარვის რუკა.
    გამგზავრებამდე გადაამოწმეთ ქვეყნის კოდი თქვენს პოლისში.

