  ask_consent: |
    SINEDIS-ის პერსონალური მონაცემების დამუშავების პოლიტიკა

    SINEDIS Sp. z o.o. პერსონალურ მონაცემებს ამუშავებს ევროკავშირის რეგლამენტის 2016/679 (GDPR / RODO) და პოლონეთის კანონმდებლობის შესაბამისად.

    მონაცემები გამოიყენება:
    • სადაზღვევო შეთავაზებების გასაანგარიშებლად;
    • სადაზღვევო ხელშეკრულებების გაფორმებისა და მომსახურებისთვის;
    • კლიენტთან კომუნიკაციისთვის;
    • კანონმდებლობის მოთხოვნების შესასრულებლად;
    • მარკეტინგული კომუნიკაციისთვის მომხმარებლის თანხმობის შემთხვევაში.

    შესაძლებელია დამუშავდეს:
    სახელი, ტელეფონი, e-mail, მისამართი, სატრანსპორტო საშუალების მონაცემები, სადაზღვევო ინფორმაცია, საგადახდო და ტექნიკური მონაცემები.

    მონაცემები შეიძლება გადაეცეს სადაზღვევო კომპანიებს, IT-კონტრაქტორებს და სხვა პარტნიორებს, რომლებიც აუცილებელია მომსახურების გასაწევად.

    მომხმარებელს უფლება აქვს:
    • მიიღოს წვდომა საკუთარ მონაცემებზე;
    • შეასწოროს ან წაშალოს მონაცემები;
    • შეზღუდოს მონაცემთა დამუშავება;
    • გაიწვიოს თანხმობა;
    • შეიტანოს საჩივარი PUODO-ში.

    მონაცემთა ადმინისტრატორი შეიძლება იყოს როგორც პოლისის გამფორმებელი სადაზღვევო კომპანია, ასევე SINEDIS Sp. z o.o.

