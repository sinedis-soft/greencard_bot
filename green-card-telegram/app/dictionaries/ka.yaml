  answers:
    documents: |
      პოლისის გასაფორმებლად საჭირო იქნება შემდეგი მონაცემები: პასპორტის მონაცემები, სატრანსპორტო საშუალების მონაცემები და დაზღვევის მოქმედების თარიღები.

      ამიტომ საჭიროა მოამზადოთ:
      - პასპორტი
      - სატრანსპორტო საშუალების რეგისტრაციის მოწმობა
      - ავტომობილის ტექნიკური მონაცემები
      - ტელეფონის ნომერი
      - e-mail

    payment: |
      ხელმისაწვდომია:
      - გადახდა პოლონურ ბარათზე საბანკო გადარიცხვით,
      - გადახდა BLIK-ით ტელეფონის ნომერზე,
      - გადახდა პოლონურ საბანკო ანგარიშზე გადარიცხვით

    coverage: "დაფარვის ტერიტორია: A - ავსტრია, B - ბელგია, BG - ბულგარეთი, CY - კვიპროსი, CZ - ჩეხეთი, D - გერმანია, DK - დანია, E - ესპანეთი, EST - ესტონეთი, F - საფრანგეთი, FIN - ფინეთი, GR - საბერძნეთი, H - უნგრეთი, HR - ხორვატია, I - იტალია, IRL - ირლანდია, IS - ისლანდია, L - ლუქსემბურგი, LT - ლიტვა, LV - ლატვია, M - მალტა, N - ნორვეგია, NL - ნიდერლანდები, P - პორტუგალია, PL - პოლონეთი, RO - რუმინეთი, S - შვედეთი, SK - სლოვაკეთი, SLO - სლოვენია, CH - შვეიცარია."

    mistakes: "გთხოვთ, გაგზავნამდე ორჯერ გადაამოწმოთ VIN, სახელმწიფო ნომერი და დაზღვევის პერიოდი. შემდგომში ცვლილებების შეტანა შეუძლებელი იქნება!"

    refund: "თანხის დაბრუნება არ ხორციელდება."

