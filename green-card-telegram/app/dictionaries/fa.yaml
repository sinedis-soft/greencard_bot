faq:
  title: "دسته‌بندی سوالات متداول را انتخاب کنید"
  categories:
    documents: "مدارک لازم برای صدور"
    payment: "پرداخت"
    coverage: "پوشش"
    mistakes: "موارد قابل توجه"
    refund: "بازپرداخت"
  answers:
    documents: |
      برای صدور بیمه‌نامه، داده‌های زیر لازم است: اطلاعات گذرنامه، اطلاعات وسیله نقلیه و اطلاعات مربوط به تاریخ‌های اعتبار بیمه.
      بنابراین باید آماده کنید:
      - گذرنامه
      - گواهی ثبت وسیله نقلیه
      - اطلاعات فنی خودرو
      - شماره تلفن
      - e-Mail
    payment: |
      روش‌های موجود:
      - پرداخت از طریق انتقال به کارت لهستانی،
      - پرداخت با BLIK به شماره تلفن،
      - پرداخت از طریق انتقال به حساب بانکی لهستانی
    coverage: "محدوده پوشش: A - اتریش، B - بلژیک، BG - بلغارستان، CY - قبرس، CZ - جمهوری چک، D - آلمان، DK - دانمارک، E - اسپانیا، EST - استونی، F - فرانسه، FIN - فنلاند، GR - یونان، H - مجارستان، HR - کرواسی، I - ایتالیا، IRL - ایرلند، IS - ایسلند، L - لوکزامبورگ، LT - لیتوانی، LV - لتونی، M - مالت، N - نروژ، NL - هلند، P - پرتغال، PL - لهستان، RO - رومانی، S - سوئد، SK - اسلواکی، SLO - اسلوونی، CH - سوئیس."
    mistakes: "لطفاً قبل از ارسال، VIN، شماره پلاک و مدت بیمه را دوباره بررسی کنید. بعداً امکان اعمال اصلاحات وجود نخواهد داشت!"
    refund: "بازپرداخت وجه انجام نمی‌شود."

coverage:
  text: |
    نقشه پوشش Green Card.
    قبل از سفر، کد کشور را در بیمه‌نامه خود بررسی کنید.
    A - اتریش، B - بلژیک، BG - بلغارستان، CY - قبرس، CZ - جمهوری چک، D - آلمان، DK - دانمارک، E - اسپانیا، EST - استونی، F - فرانسه، FIN - فنلاند، GR - یونان، H - مجارستان، HR - کرواسی، I - ایتالیا، IRL - ایرلند، IS - ایسلند، L - لوکزامبورگ، LT - لیتوانی، LV - لتونی، M - مالت، N - نروژ، NL - هلند، P - پرتغال، PL - لهستان، RO - رومانی، S - سوئد، SK - اسلواکی، SLO - اسلوونی، CH - سوئیس.

