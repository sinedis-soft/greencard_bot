  ask_consent: |
    سیاست پردازش داده‌های شخصی SINEDIS

    شرکت SINEDIS Sp. z o.o. داده‌های شخصی را مطابق با مقررات اتحادیه اروپا 2016/679 (GDPR / RODO) و قوانین جمهوری لهستان پردازش می‌کند.

    داده‌ها برای اهداف زیر استفاده می‌شوند:
    • محاسبه پیشنهادهای بیمه؛
    • صدور و پشتیبانی قراردادهای بیمه؛
    • ارتباط با مشتری؛
    • اجرای الزامات قانونی؛
    • ارتباطات بازاریابی در صورت رضایت کاربر.

    ممکن است اطلاعات زیر پردازش شوند:
    نام، شماره تلفن، ایمیل، آدرس، اطلاعات وسیله نقلیه، اطلاعات بیمه، داده‌های پرداخت و اطلاعات فنی.

    اطلاعات ممکن است به شرکت‌های بیمه، پیمانکاران IT و سایر شرکای لازم برای ارائه خدمات منتقل شوند.

    کاربر حق دارد:
    • به اطلاعات خود دسترسی داشته باشد؛
    • اطلاعات را اصلاح یا حذف کند؛
    • پردازش اطلاعات را محدود کند؛
    • رضایت خود را پس بگیرد؛
    • شکایت خود را به PUODO ارائه دهد.

    مدیر داده‌ها می‌تواند شرکت بیمه صادرکننده بیمه‌نامه یا شرکت SINEDIS Sp. z o.o. باشد.

    اطلاعات تماس:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - مسئول حفاظت از داده‌ها

    نسخه کامل سیاست:
    https://greencard.agency

    ________________________

    آیا با پردازش و انتقال داده‌های شخصی خود موافق هستید؟"

