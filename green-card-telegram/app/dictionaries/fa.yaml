    database: "🔍 بررسی بیمه‌نامه"
    restrictions: "⛔ محدودیت‌ها"
    support: "👨‍💼 ارتباط با اپراتور"

  answers:

    documents: |
      برای صدور بیمه‌نامه، مدارک زیر موردنیاز است:

      • گذرنامه یا کارت شناسایی مالک؛
      • سند یا کارت ثبت وسیله نقلیه؛
      • شماره پلاک خودرو؛
      • شماره VIN؛
      • شماره تماس؛
      • ایمیل جهت دریافت بیمه‌نامه؛
      • تاریخ شروع و مدت بیمه.

      پس از دریافت مدارک، اپراتور اطلاعات را بررسی کرده و بیمه‌نامه را آماده می‌کند.

    payment: |
      روش‌های پرداخت زیر در دسترس هستند:

      • انتقال بانکی به حساب لهستانی؛
      • انتقال به کارت بانکی لهستانی؛
      • پرداخت BLIK به شماره تلفن لهستانی.

      بیمه‌نامه پس از تأیید دریافت وجه صادر می‌شود.

    coverage: |
      بیمه‌نامه در کشورهای اتحادیه اروپا و منطقه اقتصادی اروپا معتبر است.

      پیش از سفر، حتماً فهرست کشورهای درج‌شده در گواهی بیمه خود را بررسی کنید.

    validity: |
      پوشش بیمه از تاریخ و ساعت درج‌شده در بیمه‌نامه آغاز می‌شود.

      امکان ثبت بیمه برای تاریخ آینده وجود دارد، اما نه زودتر از 7 روز قبل از شروع پوشش بیمه.

      توصیه می‌شود بیمه‌نامه را حداقل چند ساعت پیش از عبور از مرز تهیه کنید، زیرا اطلاعات خودرو از شرکت بیمه به سامانه UFG طی چند ساعت تا یک شبانه‌روز منتقل می‌شود.

      ☝️ لطفاً توجه داشته باشید! همه برندها و مدل‌های خودرو در پایگاه داده شرکت بیمه موجود نیستند. برخی خودروها مخصوص کشورهای CIS یا آمریکا تولید شده‌اند و در اتحادیه اروپا رایج نیستند. این خودروها فقط در روزهای کاری از ساعت 09:00 تا 21:00 به وقت ورشو و روز شنبه از 09:00 تا 15:00 قابل بیمه هستند.

    delivery: |
      پس از صدور بیمه‌نامه و تأیید پرداخت، فایل PDF به ایمیل ثبت‌شده ارسال خواهد شد.

      توصیه می‌شود گواهی بیمه را به‌صورت سیاه‌وسفید چاپ کنید.

      اگر ایمیل را دریافت نکردید، پوشه Spam را بررسی کرده یا با اپراتور تماس بگیرید.

    border: |
      هنگام عبور از مرز، توصیه می‌شود همراه داشته باشید:

      • نسخه چاپی بیمه‌نامه؛
      • مدارک خودرو؛
      • گذرنامه یا کارت شناسایی.

      تصمیم نهایی درباره اجازه عبور را مأموران مرزبانی اتخاذ می‌کنند.

    accident: |
      در صورت وقوع تصادف باید:

      • ایمنی محل را تأمین کنید؛
      • در صورت نیاز پلیس را خبر کنید؛
      • جزئیات حادثه را ثبت کنید؛
      • خسارت را به بیمه‌گر اطلاع دهید
      (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      بدون ثبت رسمی حادثه، محل تصادف را ترک نکنید.

    mistakes: |
      پیش از تأیید درخواست، حتماً موارد زیر را بررسی کنید:

      • شماره VIN؛
      • شماره پلاک؛
      • نوع وسیله نقلیه؛
      • تاریخ‌های بیمه.

      اشتباه در اطلاعات ممکن است باعث عدم اجازه عبور از مرز یا بروز مشکل در روند جبران خسارت شود.

    refund: |
      پس از صدور بیمه‌نامه، بازگشت حق بیمه معمولاً امکان‌پذیر نیست.

      در برخی موارد خاص، موضوع بازگشت وجه یا ابطال بیمه‌نامه به‌صورت جداگانه توسط شرکت بیمه بررسی می‌شود.

    whatis: |
      OC Graniczne نوعی بیمه اجباری مسئولیت مدنی برای وسایل نقلیه ثبت‌شده خارج از اتحادیه اروپا است.

      این بیمه‌نامه امکان تردد قانونی در کشورهای ذکرشده در گواهی بیمه را فراهم می‌کند.
    
        nogreencard: |
      Green Card و OC Graniczne دو محصول بیمه‌ای متفاوت هستند.

      Green Card در کشور محل ثبت خودرو صادر می‌شود.

      OC Graniczne برای ورود به اتحادیه اروپا در صورت نداشتن Green Card معتبر استفاده می‌شود.

    vehicles: |
      صدور بیمه برای موارد زیر امکان‌پذیر است:

      • خودروهای سواری؛
      • کامیون‌ها؛
      • اتوبوس‌ها؛
      • تریلرها؛
      • موتورسیکلت‌ها؛
      • ماشین‌آلات ویژه.

      امکان صدور بیمه به کشور ثبت خودرو و شرایط شرکت بیمه بستگی دارد.

    extension: |
      در واقع امکان تمدید مستقیم بیمه‌نامه وجود ندارد.

      فقط می‌توان بیمه‌نامه جدید صادر کرد.

    legalentity: |
      بیمه‌نامه فقط به نام شخص حقیقی صادر می‌شود.

      برای مشتریان شرکتی، بیمه باید به نام راننده ثبت شود.

    online: |
      تمام مراحل صدور کاملاً آنلاین انجام می‌شود.

      مدارک به‌صورت آنلاین دریافت شده و بیمه‌نامه آماده از طریق ایمیل ارسال می‌شود.

    database: |
      پس از صدور بیمه‌نامه، اطلاعات ممکن است بلافاصله در سامانه‌های بیمه نمایش داده نشود.

      به‌روزرسانی اطلاعات گاهی تا 24 ساعت زمان می‌برد.

      بررسی اعتبار بیمه‌نامه از طریق سایت زیر امکان‌پذیر است:
      https://www.ufg.pl/

    restrictions: |
      بیمه مرزی فقط مسئولیت مدنی در برابر اشخاص ثالث را پوشش می‌دهد.

      خسارت واردشده به خودروی شخص بیمه‌گذار تحت پوشش نیست.

    support: |
      اگر درباره صدور، پرداخت یا اعتبار بیمه‌نامه سؤال دارید، از طریق Telegram یا WhatsApp با اپراتور تماس بگیرید.

coverage:
  text: |
    نقشه پوشش OC graniczne (بیمه مرزی).

    پیش از سفر، کد کشور درج‌شده در بیمه‌نامه خود را بررسی کنید.

    A - اتریش، B - بلژیک، BG - بلغارستان، CY - قبرس، CZ - جمهوری چک، D - آلمان، DK - دانمارک، E - اسپانیا، EST - استونی، F - فرانسه، FIN - فنلاند، GR - یونان، H - مجارستان، HR - کرواسی، I - ایتالیا، IRL - ایرلند، IS - ایسلند، L - لوکزامبورگ، LT - لیتوانی، LV - لتونی، M - مالت، N - نروژ، NL - هلند، P - پرتغال، PL - لهستان، RO - رومانی، S - سوئد، SK - اسلواکی، SLO - اسلوونی، CH - سوئیس.

