  ask_consent: |
    سیاست پردازش داده‌های شخصی SINEDIS
    SINEDIS Sp. z o.o. داده‌های شخصی را مطابق با مقررات اتحادیه اروپا 2016/679 (GDPR / RODO) و قوانین لهستان پردازش می‌کند.
    داده‌ها برای موارد زیر استفاده می‌شوند:
    • محاسبه پیشنهادهای بیمه‌ای;
    • صدور و پشتیبانی قراردادهای بیمه;
    • ارتباط با مشتری;
    • اجرای الزامات قانونی;
    • ارتباطات بازاریابی در صورت وجود رضایت کاربر.
    ممکن است داده‌های زیر پردازش شوند:
    نام، تلفن، e-mail، آدرس، اطلاعات وسیله نقلیه، اطلاعات بیمه‌ای، داده‌های پرداخت و داده‌های فنی.
    داده‌ها ممکن است به شرکت‌های بیمه، پیمانکاران IT و سایر شرکای لازم برای ارائه خدمات منتقل شوند.
    کاربر حق دارد:
    • به داده‌ها دسترسی داشته باشد;
    • داده‌ها را اصلاح یا حذف کند;
    • پردازش را محدود کند;
    • رضایت خود را پس بگیرد;
    • به PUODO شکایت ارائه کند.
    کنترل‌کننده داده‌ها می‌تواند شرکت بیمه صادرکننده بیمه‌نامه یا SINEDIS Sp. z o.o. باشد.
    اطلاعات تماس:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - بازرس حفاظت از داده‌ها
    نسخه کامل سیاست:
    https://greencard.agency
    ________________________
    آیا با پردازش و انتقال داده‌های شخصی موافق هستید؟"
