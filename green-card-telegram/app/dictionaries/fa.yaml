faq:
  title: "دسته FAQ را انتخاب کنید"
  categories:
    documents: "مدارک برای صدور"
    payment: "پرداخت"
    coverage: "پوشش"
    mistakes: "نکات مهم"
    refund: "بازپرداخت"
  answers:
    documents: |
      برای صدور بیمه‌نامه، اطلاعات زیر لازم است: اطلاعات گذرنامه، اطلاعات وسیله نقلیه و تاریخ‌های اعتبار بیمه
      بنابراین باید آماده کنید:
      - گذرنامه
      - گواهی ثبت وسیله نقلیه
      - اطلاعات فنی خودرو
      - شماره تلفن
      - e-Mail
    payment: |
      روش‌های موجود:
      - پرداخت از طریق انتقال به کارت لهستانی, 
      - پرداخت با BLIK به شماره تلفن, 
      - پرداخت از طریق انتقال به حساب بانکی لهستان"
    coverage: "منطقه پوشش: A - اتریش، B - بلژیک، BG - بلغارستان، CY - قبرس، CZ - جمهوری چک، D - آلمان، DK - دانمارک، E - اسپانیا، EST - استونی، F - فرانسه، FIN - فنلاند، GR - یونان، H - مجارستان، HR - کرواسی، I - ایتالیا، IRL - ایرلند، IS - ایسلند، L - لوکزامبورگ، LT - لیتوانی، LV - لتونی، M - مالت، N - نروژ، NL - هلند، P - پرتغال، PL - لهستان، RO - رومانی، S - سوئد، SK - اسلواکی، SLO - اسلوونی، CH - سوئیس."
    mistakes: "لطفاً قبل از ارسال، VIN، شماره پلاک و مدت بیمه را دوباره بررسی کنید. بعداً امکان اصلاح وجود نخواهد داشت!"
    refund: "بازپرداخت وجه انجام نمی‌شود."

