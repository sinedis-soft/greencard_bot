  title: "Абярыце катэгорыю FAQ"

  categories:
    documents: "📄 Дакументы"
    payment: "💳 Аплата"
    coverage: "🌍 Тэрыторыя дзеяння"
    validity: "📅 Тэрмін дзеяння"
