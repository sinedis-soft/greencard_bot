  ask_consent: |
    Палітыка апрацоўкі персанальных даных SINEDIS
    SINEDIS Sp. z o.o. апрацоўвае персанальныя даныя ў адпаведнасці з Рэгламентам ЕС 2016/679 (GDPR / RODO) і заканадаўствам Польшчы.
    Даныя выкарыстоўваюцца для:
    • разліку страхавых прапаноў;
    • афармлення і суправаджэння страхавых дагавораў;
    • сувязі з кліентам;
    • выканання патрабаванняў заканадаўства;
    • маркетынгавай камунікацыі пры наяўнасці згоды карыстальніка.
    Могуць апрацоўвацца:
    імя, тэлефон, e-mail, адрас, даныя транспартнага сродку, страхавая інфармацыя, плацежныя і тэхнічныя даныя.
    Даныя могуць перадавацца страхавым кампаніям, IT-падрадчыкам і іншым партнёрам, неабходным для аказання паслуг.
    Карыстальнік мае права:
    • атрымаць доступ да даных;
    • выправіць або выдаліць даныя;
    • абмежаваць апрацоўку;
    • адклікаць згоду;
    • падаць скаргу ў PUODO.
    Адміністратарам даных можа выступаць страхавая кампанія, якая аформіла поліс, або SINEDIS Sp. z o.o.
    Кантакты:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - інспектар па ахове даных
    Поўная версія палітыкі:
    https://greencard.agency
    ________________________
    Ці згодныя вы на апрацоўку і перадачу персанальных даных?
  consent_agree: "✅ Пагадзіцца і адправіць"
  consent_decline: "❌ Адмовіцца"
