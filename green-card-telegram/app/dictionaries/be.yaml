    refund: "↩️ Вяртанне сродкаў"
    whatis: "ℹ️ Што такое Europolis?"
    nogreencard: "🟢 Адрозненне ад Green Card"
    vehicles: "🚘 Тыпы транспартных сродкаў"
    extension: "🔄 Падаўжэнне"
    legalentity: "🏢 Юрыдычныя асобы"
    online: "📱 Анлайн-афармленне"
    database: "🔍 Праверка поліса"
    restrictions: "⛔ Абмежаванні"
    support: "👨‍💼 Сувязь з аператарам"

  answers:

    documents: |
      Для афармлення поліса спатрэбяцца:

      • Пашпарт або пасведчанне асобы ўладальніка;
      • Пасведчанне аб рэгістрацыі транспартнага сродку;
      • Рэгістрацыйны нумар аўтамабіля;
      • VIN-нумар;
      • Кантактны тэлефон;
      • E-mail для атрымання поліса;
      • Дата пачатку страхавання і тэрмін страхавання.

      Пасля атрымання дакументаў аператар праверыць даныя і падрыхтуе поліс.

    payment: |
      Даступныя наступныя спосабы аплаты:

      • Перавод на польскі банкаўскі рахунак;
      • Перавод на польскую банкаўскую карту;
      • BLIK на польскі нумар тэлефона.

      ⚠️Жыхарам РФ неабходна выкарыстоўваць альтэрнатыўныя спосабы аплаты (напрыклад wise.com)

      ⚠️Жыхарам Беларусі неабходна выкарыстоўваць праграмы банкаў ПрыёрБанк, МТБанк, БСБанк, бо большасць іншых банкаў знаходзіцца пад санкцыямі
   
      Поліс афармляецца пасля пацвярджэння паступлення аплаты.

    coverage: |
      Поліс дзейнічае на тэрыторыі краін Еўрапейскага Саюза і Еўрапейскай эканамічнай зоны.

      Перад паездкай абавязкова праверце пералік краін, указаных у вашым страхавым сертыфікаце.

    validity: |
      Страхавая абарона пачынае дзейнічаць з даты і часу, указаных у полісе.

      Аформіць страхоўку можна загадзя на будучую дату, але не раней чым за 7 дзён да пачатку страхавога пакрыцця.

      Рэкамендуем афармляць поліс мінімум за некалькі гадзін да перасячэння мяжы, паколькі даныя пра аўтамабіль перадаюцца са страхавой кампаніі ў UFG ад некалькіх гадзін да сутак.

      ☝️Калі ласка, улічыце! Не ўсе маркі і мадэлі аўтамабіляў ёсць у базе страхавой кампаніі. Некаторыя аўто створаны для краін СНД або ЗША і не з’яўляюцца папулярнымі ў ЕС. Такія аўто можна застрахаваць толькі ў будныя дні з 9:00 да 21:00 па Варшаве і ў суботу з 09:00 да 15:00.

    delivery: |
      Пасля афармлення і пацвярджэння аплаты поліс накіроўваецца на пазначаны e-mail у фармаце PDF.

      Рэкамендуецца раздрукаваць сертыфікат у чорна-белым выглядзе.

      Калі ліст не прыйшоў, праверце папку «Спам» або звяжыцеся з аператарам.

    border: |
      Пры перасячэнні мяжы рэкамендуецца мець:

      • Раздрукаваны поліс;
      • Дакументы на аўтамабіль;
      • Пашпарт або ID.

      Канчатковае рашэнне аб пропуску прымае памежная служба.

    accident: |
      Пры ДТЗ неабходна:

      • Забяспечыць бяспеку;
      • Пры неабходнасці выклікаць паліцыю;
      • Зафіксаваць абставіны здарэння;
      • Паведаміць страхоўшчыку (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      Не пакідайце месца ДТЗ без афармлення здарэння.

    mistakes: |
      Перад пацвярджэннем заяўкі ўважліва праверце:

      • VIN-нумар;
      • Дзяржаўны нумар;
      • Тып транспартнага сродку;
      • Даты страхавання.

      Памылкі могуць прывесці да адмовы ў перасячэнні мяжы або праблем пры ўрэгуляванні страхавога выпадку.

    refund: |
      Пасля выпуску страхавога поліса вяртанне страхавой прэміі звычайна немагчымае.

      У асобных выпадках пытанне вяртання або анулявання разглядаецца страхоўшчыкам індывідуальна.

    whatis: |
      OC Graniczne — абавязковае страхаванне грамадзянскай адказнасці для транспартных сродкаў, зарэгістраваных па-за межамі ЕС.

      Поліс дазваляе законна перамяшчацца па тэрыторыі краін, указаных у сертыфікаце.

        nogreencard: |
      Green Card і OC Graniczne — гэта розныя страхавыя прадукты.

      Green Card афармляецца ў краіне рэгістрацыі аўтамабіля.

      OC Graniczne выкарыстоўваецца для ўезду ў ЕС пры адсутнасці дзейнай Green Card.

    vehicles: |
      Афармленне магчыма для:

      • Легкавых аўтамабіляў;
      • Грузавых аўтамабіляў;
      • Аўтобусаў;
      • Прычэпаў;
      • Матацыклаў;
      • Спецтэхнікі.

      Магчымасць афармлення залежыць ад краіны рэгістрацыі і ўмоў страхоўшчыка.

    extension: |
      Як такога падаўжэння поліса няма. Магчымы толькі выпуск новага поліса.

    legalentity: |
      Поліс можа быць аформлены толькі на фізічную асобу.

      Для карпаратыўных кліентаў поліс неабходна афармляць на кіроўцу.

    online: |
      Афармленне цалкам дыстанцыйнае.

      Дакументы прымаюцца анлайн, а гатовы поліс адпраўляецца па электроннай пошце.

    database: |
      Пасля афармлення даныя поліса могуць адлюстроўвацца ў страхавых базах не адразу.

      Абнаўленне інфармацыі часам займае да 24 гадзін.

      Праверыць поліс можна на сайце https://www.ufg.pl/

    restrictions: |
      Памежнае страхаванне пакрывае толькі грамадзянскую адказнасць перад трэцімі асобамі.

      Шкода вашаму ўласнаму аўтамабілю не пакрываецца.

    support: |
      Калі ў вас узніклі пытанні па афармленні, аплаце або дзеянні поліса, звяжыцеся з аператарам праз Telegram або WhatsApp.

coverage:
  text: |
    Карта пакрыцця OC graniczne (border insurance).
    Перад паездкай праверце код краіны ў вашым полісе.
    A - Аўстрыя, B - Бельгія, BG - Балгарыя, CY - Кіпр, CZ - Чэхія, D - Германія, DK - Данія, E - Іспанія, EST - Эстонія, F - Францыя, FIN - Фінляндыя, GR - Грэцыя, H - Венгрыя, HR - Харватыя, I - Італія, IRL - Ірландыя, IS - Ісландыя, L - Люксембург, LT - Літва, LV - Латвія, M - Мальта, N - Нарвегія, NL - Нідэрланды, P - Партугалія, PL - Польшча, RO - Румынія, S - Швецыя, SK - Славакія, SLO - Славенія, CH - Швейцарыя.

