faq:
  title: "Абярыце катэгорыю FAQ"
  categories:
    documents: "Дакументы для афармлення"
    payment: "Аплата"
    coverage: "Пакрыццё"
    mistakes: "На што звярнуць увагу"
    refund: "Вяртанне сродкаў"
  answers:
    documents: |
      Для афармлення поліса спатрэбяцца наступныя даныя: пашпартныя даныя, даныя транспартнага сродку і даныя па тэрмінах дзеяння страхоўкі.
      Таму вам неабходна падрыхтаваць:
      - пашпарт
      - пасведчанне аб рэгістрацыі транспартнага сродку
      - тэхнічныя даныя аўтамабіля
      - нумар тэлефона
      - e-Mail
    payment: |
      Даступна:
      - аплата пераводам на польскую карту,
      - аплата BLIK на нумар тэлефона,
      - аплата пераводам на польскі разліковы рахунак
    coverage: "Тэрыторыя пакрыцця: A - Аўстрыя, B - Бельгія, BG - Балгарыя, CY - Кіпр, CZ - Чэхія, D - Германія, DK - Данія, E - Іспанія, EST - Эстонія, F - Францыя, FIN - Фінляндыя, GR - Грэцыя, H - Венгрыя, HR - Харватыя, I - Італія, IRL - Ірландыя, IS - Ісландыя, L - Люксембург, LT - Літва, LV - Латвія, M - Мальта, N - Нарвегія, NL - Нідэрланды, P - Партугалія, PL - Польшча, RO - Румынія, S - Швецыя, SK - Славакія, SLO - Славенія, CH - Швейцарыя."
    mistakes: "Калі ласка, двойчы праверце VIN, нумарны знак і перыяд страхавання перад адпраўкай. Унесці змены пазней будзе немагчыма!"
    refund: "Вяртанне сродкаў не ажыццяўляецца."

