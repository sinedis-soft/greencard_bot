faq:
  title: "Selectați categoria FAQ"

  categories:
    documents: "📄 Documente"
    payment: "💳 Plată"
    coverage: "🌍 Teritoriu de acoperire"
    validity: "📅 Perioada de valabilitate"
    delivery: "📧 Primirea poliței"
    border: "🛂 Trecerea frontierei"
    accident: "🚗 Accident și caz asigurat"
    mistakes: "⚠️ Informații importante"
    refund: "↩️ Rambursare"
    whatis: "ℹ️ Ce este Europolis?"
    nogreencard: "🟢 Diferența față de Green Card"
    vehicles: "🚘 Tipuri de vehicule"
    extension: "🔄 Prelungirea poliței"
    legalentity: "🏢 Persoane juridice"
    online: "📱 Emitere online"
    database: "🔍 Verificarea poliței"
    restrictions: "⛔ Restricții"
    support: "👨‍💼 Contact operator"

  answers:

    documents: |
      Pentru emiterea poliței sunt necesare:

      • Pașaportul sau actul de identitate al proprietarului;
      • Certificatul de înmatriculare al vehiculului;
      • Numărul de înmatriculare;
      • Numărul VIN;
      • Număr de telefon de contact;
      • E-mail pentru primirea poliței;
      • Data începerii și perioada asigurării.

      După primirea documentelor, operatorul va verifica datele și va pregăti polița.

    payment: |
      Sunt disponibile următoarele metode de plată:

      • Transfer către un cont bancar polonez;
      • Transfer către un card bancar polonez;
      • BLIK către un număr de telefon polonez.

      Polița este emisă după confirmarea primirii plății.

    coverage: |
      Polița este valabilă pe teritoriul țărilor Uniunii Europene și al Spațiului Economic European.

      Înainte de călătorie, verificați obligatoriu lista țărilor indicate în certificatul de asigurare.

    validity: |
      Protecția de asigurare începe de la data și ora indicate în poliță.

      Asigurarea poate fi emisă în avans pentru o dată viitoare, dar nu mai devreme de 7 zile înainte de începerea acoperirii.

      Recomandăm emiterea poliței cu cel puțin câteva ore înainte de trecerea frontierei, deoarece datele vehiculului sunt transmise de compania de asigurări către UFG într-un interval de la câteva ore până la o zi.

      ☝️Vă rugăm să rețineți! Nu toate mărcile și modelele de vehicule există în baza de date a companiei de asigurări. Unele vehicule sunt produse pentru țările CSI sau SUA și nu sunt populare în UE. Astfel de vehicule pot fi asigurate doar în zilele lucrătoare între 09:00 și 21:00, ora Varșoviei, iar sâmbăta între 09:00 și 15:00.

    delivery: |
      După emiterea poliței și confirmarea plății, aceasta va fi trimisă la adresa de e-mail indicată în format PDF.

      Se recomandă imprimarea certificatului alb-negru.

      Dacă mesajul nu a fost primit, verificați folderul „Spam” sau contactați operatorul.

    border: |
      La trecerea frontierei se recomandă să aveți:

      • Polița tipărită;
      • Documentele vehiculului;
      • Pașaportul sau actul de identitate.

      Decizia finală privind permiterea intrării aparține autorităților de frontieră.

    accident: |
      În caz de accident este necesar:

      • Să asigurați siguranța;
      • Dacă este necesar, să chemați poliția;
      • Să documentați circumstanțele incidentului;
      • Să informați asigurătorul (https://www.warta.pl/pomoc-i-obsluga/zgloszenie-szkody/formularz-majatek/#/dla-ciebie/pojazd/informacje-o-zdarzeniu).

      Nu părăsiți locul accidentului fără întocmirea documentelor necesare.

    mistakes: |
      Înainte de confirmarea solicitării, verificați cu atenție:

      • Numărul VIN;
      • Numărul de înmatriculare;
      • Tipul vehiculului;
      • Datele asigurării.

      Erorile pot duce la refuzul trecerii frontierei sau la probleme în procesul de despăgubire.

    refund: |
      După emiterea poliței de asigurare, rambursarea primei de asigurare, de regulă, nu este posibilă.

      În anumite cazuri, cererea de rambursare sau anulare este analizată individual de către asigurător.

    whatis: |
      OC Graniczne este o asigurare obligatorie de răspundere civilă pentru vehiculele înmatriculate în afara UE.

      Polița permite circulația legală pe teritoriul țărilor indicate în certificat.
        nogreencard: |
      Green Card și OC Graniczne sunt produse de asigurare diferite.

      Green Card se emite în țara în care este înmatriculat vehiculul.

      OC Graniczne este utilizat pentru intrarea în UE în lipsa unei Green Card valabile.

    vehicles: |
      Emiterea este posibilă pentru:

      • Autoturisme;
      • Camioane;
      • Autobuze;
      • Remorci;
      • Motociclete;
      • Vehicule speciale.

      Posibilitatea emiterii depinde de țara de înmatriculare și de condițiile asigurătorului.

    extension: |
      În practică, polița nu poate fi prelungită.

      Se poate emite doar o poliță nouă.

    legalentity: |
      Polița poate fi emisă doar pe numele unei persoane fizice.

      Pentru clienții корпоративativi, polița trebuie emisă pe numele șoferului.

    online: |
      Emiterea se realizează complet la distanță.

      Documentele sunt primite online, iar polița finală este trimisă prin e-mail.

    database: |
      După emitere, datele poliței pot apărea în bazele de date ale asiguratorilor cu întârziere.

      Actualizarea informațiilor poate dura până la 24 de ore.

      Polița poate fi verificată pe site-ul https://www.ufg.pl/

    restrictions: |
      Asigurarea de frontieră acoperă doar răspunderea civilă față de terți.

      Daunele produse propriului vehicul nu sunt acoperite.

    support: |
      Dacă aveți întrebări privind emiterea, plata sau valabilitatea poliței, contactați operatorul prin Telegram sau WhatsApp.

coverage:
  text: |
    Harta de acoperire OC graniczne (asigurare de frontieră).

    Înainte de călătorie, verificați codul țării indicat în polița dumneavoastră.

    A - Austria, B - Belgia, BG - Bulgaria, CY - Cipru, CZ - Cehia, D - Germania, DK - Danemarca, E - Spania, EST - Estonia, F - Franța, FIN - Finlanda, GR - Grecia, H - Ungaria, HR - Croația, I - Italia, IRL - Irlanda, IS - Islanda, L - Luxemburg, LT - Lituania, LV - Letonia, M - Malta, N - Norvegia, NL - Țările de Jos, P - Portugalia, PL - Polonia, RO - România, S - Suedia, SK - Slovacia, SLO - Slovenia, CH - Elveția.

