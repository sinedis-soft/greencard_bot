faq:
  title: "Selectați categoria FAQ"
  categories:
    documents: "Documente pentru emitere"
    payment: "Plată"
    coverage: "Acoperire"
    mistakes: "Atenție"
    refund: "Rambursare"
  answers:
    documents: |
      Pentru emiterea poliței sunt necesare următoarele date: datele pașaportului, datele vehiculului și perioada de valabilitate a asigurării
      Prin urmare, trebuie să pregătiți:
      - pașaportul
      - certificatul de înmatriculare al vehiculului
      - datele tehnice ale automobilului
      - numărul de telefon
      - e-Mail
    payment: |
      Disponibil:
      - plată prin transfer pe card polonez, 
      - plată prin BLIK la numărul de telefon, 
      - plată prin transfer pe cont bancar polonez"
    coverage: "Teritoriul de acoperire: A - Austria, B - Belgia, BG - Bulgaria, CY - Cipru, CZ - Cehia, D - Germania, DK - Danemarca, E - Spania, EST - Estonia, F - Franța, FIN - Finlanda, GR - Grecia, H - Ungaria, HR - Croația, I - Italia, IRL - Irlanda, IS - Islanda, L - Luxemburg, LT - Lituania, LV - Letonia, M - Malta, N - Norvegia, NL - Țările de Jos, P - Portugalia, PL - Polonia, RO - România, S - Suedia, SK - Slovacia, SLO - Slovenia, CH - Elveția."
    mistakes: "Vă rugăm să verificați de două ori VIN-ul, numărul de înmatriculare și perioada asigurării înainte de trimitere. Corectările ulterioare nu vor fi posibile!"
    refund: "Rambursarea fondurilor nu se efectuează."

