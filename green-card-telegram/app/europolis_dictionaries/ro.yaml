faq:
  title: "Alegeți categoria FAQ"
  categories:
    documents: "Documente pentru perfectare"
    payment: "Plată"
    coverage: "Acoperire"
    mistakes: "Atenție"
    refund: "Rambursare"
  answers:
    documents: |
      Pentru perfectarea poliței vor fi necesare următoarele date: datele pașaportului, datele mijlocului de transport și datele privind perioada de valabilitate a asigurării.
      De aceea, trebuie să pregătiți:
      - pașaportul
      - certificatul de înmatriculare al mijlocului de transport
      - datele tehnice ale automobilului
      - numărul de telefon
      - e-mailul
    payment: |
      Disponibil:
      - plata prin transfer pe card polonez,
      - plata prin BLIK la numărul de telefon,
      - plata prin transfer în cont bancar polonez
    coverage: "Teritoriul de acoperire: A - Austria, B - Belgia, BG - Bulgaria, CY - Cipru, CZ - Cehia, D - Germania, DK - Danemarca, E - Spania, EST - Estonia, F - Franța, FIN - Finlanda, GR - Grecia, H - Ungaria, HR - Croația, I - Italia, IRL - Irlanda, IS - Islanda, L - Luxemburg, LT - Lituania, LV - Letonia, M - Malta, N - Norvegia, NL - Țările de Jos, P - Portugalia, PL - Polonia, RO - România, S - Suedia, SK - Slovacia, SLO - Slovenia, CH - Elveția."
    mistakes: "Vă rugăm să verificați de două ori VIN-ul, numărul de înmatriculare și perioada de asigurare înainte de trimitere. Ulterior nu va fi posibilă efectuarea modificărilor!"
    refund: "Rambursarea banilor nu se efectuează."

