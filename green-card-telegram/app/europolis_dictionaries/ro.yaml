  ask_consent: |
    Politica de prelucrare a datelor cu caracter personal SINEDIS
    SINEDIS Sp. z o.o. prelucrează datele cu caracter personal în conformitate cu Regulamentul UE 2016/679 (GDPR / RODO) și legislația Poloniei.
    Datele sunt utilizate pentru:
    • calcularea ofertelor de asigurare;
    • perfectarea și administrarea contractelor de asigurare;
    • comunicarea cu clientul;
    • îndeplinirea cerințelor legale;
    • comunicări de marketing în cazul existenței consimțământului utilizatorului.
    Pot fi prelucrate:
    numele, telefonul, e-mailul, adresa, datele mijlocului de transport, informațiile de asigurare, datele de plată și datele tehnice.
    Datele pot fi transmise companiilor de asigurări, contractorilor IT și altor parteneri necesari pentru prestarea serviciilor.
    Utilizatorul are dreptul:
    • să obțină acces la date;
    • să corecteze sau să șteargă datele;
    • să restricționeze prelucrarea;
    • să retragă consimțământul;
    • să depună plângere la PUODO.
    Administratorul datelor poate fi compania de asigurări care a emis polița sau SINEDIS Sp. z o.o.
    Contacte:
    SINEDIS Sp. z o.o.
    ul. Dobrzańskiego Hubala 22D, 01-473 Warszawa, Polska
    info@sinedis.pl
    odo@sinedis.pl - inspector pentru protecția datelor
    Versiunea completă a politicii:
    https://greencard.agency
    ________________________
    Sunteți de acord cu prelucrarea și transmiterea datelor cu caracter personal?
