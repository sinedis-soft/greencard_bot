  ask_consent: |
    Информированное согласие на обработку персональных данных EuroPolis
    EuroPolis и латвийская страховая компания, для которой оформляется полис, обрабатывают персональные данные в соответствии с Регламентом ЕС 2016/679 (GDPR) и законодательством Латвийской Республики.
    Данные используются для:
    • расчёта страховых предложений для физических и юридических лиц;
    • оформления и сопровождения страховых договоров;
    • связи с клиентом или представителем компании;
    • проверки документов и выполнения требований законодательства;
    • передачи информации страховой компании, CRM, платёжным, IT- и иным подрядчикам, необходимым для оказания услуги.
    Могут обрабатываться:
    имя, фамилия, телефон, e-mail, адрес, паспортные или регистрационные данные, данные компании и представителя, данные транспортного средства, страховая информация, платёжные и технические данные Telegram-диалога.
    Пользователь или представитель юридического лица подтверждает, что имеет право передать данные и согласен на их обработку для оформления полиса.
    Субъект данных имеет право:
    • получить доступ к данным;
    • исправить или удалить данные;
    • ограничить обработку;
    • отозвать согласие;
    • подать жалобу в надзорный орган по защите данных Латвии.
    Администратором данных может выступать латвийская страховая компания, оформившая полис, либо EuroPolis в части клиентского сопровождения.
    ________________________
    Согласны на обработку и передачу персональных данных для оформления полиса EuroPolis?
