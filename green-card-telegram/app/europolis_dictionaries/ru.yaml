    extension: "🔄 Продление полиса"
    legalentity: "🏢 Юридические лица"
    online: "📱 Онлайн-оформление"
    database: "🔍 Проверка полиса"
    restrictions: "⛔ Ограничения"
    support: "👨‍💼 Связь с оператором"

  answers:

    documents: |
      Для оформления полиса потребуются:

      • Паспорт или удостоверение личности владельца;
      • Свидетельство о регистрации транспортного средства;
      • Регистрационный номер автомобиля;
      • VIN-номер;
      • Контактный телефон;
      • E-mail для получения полиса;
      • Дата начала страхования и срок страхования.

      После получения документов оператор проверит данные и подготовит полис.

    payment: |
      Доступны следующие способы оплаты:

      • Перевод на польский банковский счёт;
      • Перевод на польскую банковскую карту;
      • BLIK на польский номер телефона.

      ⚠️Жителям РФ необходимо использовать сторонние методы оплаты (например wise.com)

      ⚠️Жителям Беларуси необходимо использовать прилажения банков ПриорБанк, МТбанк, БСБанк, большенство остальных банков под санкциями
   
      Полис оформляется после подтверждения поступления оплаты.

    coverage: |
      Полис действует на территории стран Европейского Союза и Европейской экономической зоны.

      Перед поездкой обязательно проверьте перечень стран, указанных в вашем страховом сертификате.

    validity: |
      Страховая защита начинает действовать с даты и времени, указанных в полисе.

      Оформить страховку можно заранее на будущую дату, но не ранее чем за 7 дней до начала покрытия страховки.

      Рекомендуем оформлять полис минимум за несколько часов до пересечения границы. Так как данные о авто передаются из страховой компании в UFG в течение от несколььких часов до суток.

      ☝️Просим учесть! Не все марки и модели авто есть в базе страховой компании. Некоторые авто созданы для стран СНГ или США, и не поппулярны в ЕС. Такие авто возможно застраховать только в будний день с 9:00 до 21:00 по Варшаве и в субботу с 09:00 до 15:00. 

    delivery: |
      После оформления и подтверждения оплаты полис направляется на указанный e-mail в формате PDF.

      Рекомендуется распечатать сертификат черным по белому.

      Если письмо не пришло, проверьте папку «Спам» или свяжитесь с оператором.

    border: |
      При пересечении границы рекомендуется иметь:

      • Распечатанный полис;
      • Документы на автомобиль;
      • Паспорт или ID.

      Окончательное решение о пропуске принимает пограничная служба.

    accident: |
      При ДТП необходимо:

      • Обеспечить безопасность;
      • При необходимости вызвать полицию;
      • Зафиксировать обстоятельства происшествия;
      • Сообщить страховщику (info@ergo.lv).

      Не покидайте место ДТП без оформления происшествия.

    mistakes: |
      Перед подтверждением заявки внимательно проверьте:

      • VIN-номер;
      • Государственный номер;
      • Тип транспортного средства;
      • Даты страхования.

      Ошибки могут привести к отказу в пересечении границы или проблемам при урегулировании убытка.

    refund: |
      После выпуска страхового полиса возврат страховой премии обычно невозможен.

      В отдельных случаях вопрос возврата или аннулирования рассматривается страховщиком индивидуально.

    whatis: |
      Europolis (ROCTA) — обязательное страхование гражданской ответственности для транспортных средств, зарегистрированных за пределами ЕС.

      Полис позволяет законно передвигаться по территории стран, указанных в сертификате.

    nogreencard: |
      Green Card и Europolis — разные страховые продукты.

      Green Card оформляется в стране регистрации автомобиля.

      Europolis (ROCTA) используется для въезда в ЕС при отсутствии действующей Green Card.

    vehicles: |
      Оформление возможно для:

      • Легковых автомобилей;
      • Грузовых автомобилей;
      • Автобусов;
      • Прицепов;
      • Мотоциклов;
      • Спецтехники.

      Возможность оформления зависит от страны регистрации и условий страховщика.

    extension: |
      Как такового продления полиса нет. Есть только выпуск нового полиса.

    legalentity: |
      Полис может быть оформлен как на физическое, так и на юридическое лицо.

      Для корпоративных клиентов может потребоваться дополнительная информация о компании.

    online: |
      Оформление полностью дистанционное.

      Документы принимаются онлайн, а готовый полис отправляется по электронной почте.

    database: |
      После оформления данные полиса могут отображаться в страховых базах не сразу.

      Обновление информации иногда занимает до 24 часов.

      Проверить полис можно на сайте https://services.ltab.lv/lv/CheckOcta

    restrictions: |
      Пограничное страхование покрывает только гражданскую ответственность перед третьими лицами.

      Ущерб вашему собственному автомобилю не покрывается.

    support: |
      Если у вас возникли вопросы по оформлению, оплате или действию полиса, свяжитесь с оператором через Telegram или WhatsApp.
